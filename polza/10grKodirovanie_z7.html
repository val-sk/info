```html
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кодирование информации · 10 класс · текст / изображение / звук / видео</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F6FB; --surface:#FFFFFF; --surface2:#F7FAFF; --line:#DCE4F2; --line2:#C9D5EC;
  --ink:#0E1526; --muted:#5B6780; --scrim:rgba(14,21,38,.45);
  --blue:#2563EB; --indigo:#4F46E5; --cyan:#06B6D4; --magenta:#D946EF; --violet:#7C3AED;
  --green:#10B981; --lime:#84CC16; --amber:#F59E0B; --red:#EF4444;
  --grad-main:linear-gradient(120deg,#2563EB,#06B6D4 46%,#D946EF);
  --grad-hot:linear-gradient(120deg,#D946EF,#7C3AED 55%,#2563EB);
  --shadow:0 2px 0 rgba(37,99,235,.04),0 18px 44px -22px rgba(30,64,175,.30);
  --r-lg:20px; --r-md:15px; --r-sm:11px;
  --hdr:64px;
}
*{box-sizing:border-box;margin:0;padding:0;scrollbar-width:thin;scrollbar-color:#7C3AED #EDF1FA}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:#EDF1FA;border-radius:10px}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#2563EB,#D946EF);border-radius:10px;border:3px solid #EDF1FA}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,#1D4ED8,#A21CAF)}
::selection{background:#D946EF;color:#fff}
[hidden]{display:none!important}
html,body{height:100%}
body{
  font-family:'Manrope',system-ui,'Segoe UI',sans-serif;color:var(--ink);background:var(--paper);
  background-image:linear-gradient(rgba(37,99,235,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(37,99,235,.05) 1px,transparent 1px);
  background-size:30px 30px;font-size:16px;line-height:1.55;overflow:hidden;
}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px;border-radius:8px}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.disp{font-family:'Unbounded','Manrope',sans-serif}

/* ---------- фоновые слои ---------- */
#bgGlow{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(8px)}
.blob.b1{width:56vw;height:56vw;top:-22vw;right:-16vw;background:radial-gradient(closest-side,rgba(6,182,212,.16),transparent 72%);animation:drift 30s ease-in-out infinite alternate}
.blob.b2{width:48vw;height:48vw;bottom:-20vw;left:-14vw;background:radial-gradient(closest-side,rgba(217,70,239,.13),transparent 72%);animation:drift 36s ease-in-out -16s infinite alternate-reverse}
.blob.b3{width:34vw;height:34vw;top:30%;left:38%;background:radial-gradient(closest-side,rgba(37,99,235,.10),transparent 72%);animation:drift 42s ease-in-out -8s infinite alternate}
@keyframes drift{to{transform:translate(-5vw,4vh) scale(1.12)}}
#circuit{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5}
#circuit path{fill:none;stroke:#9DB4E8;stroke-width:1.4}
#circuit .pulse{stroke:url(#cgrad);stroke-width:2.2;stroke-dasharray:14 220;animation:trace 7s linear infinite}
#circuit .pulse.p2{animation-delay:-3.4s;animation-duration:9s}
#circuit circle{fill:#B9C9EE}
@keyframes trace{to{stroke-dashoffset:-468}}
#binLayer{position:fixed;inset:0;z-index:0;pointer-events:none;display:grid;align-content:space-between;justify-content:space-between;padding:70px 8px 8px;overflow:hidden}
.bin{font-family:'JetBrains Mono',monospace;font-size:13px;color:#33507F;opacity:.06;transition:opacity .5s,color .5s,text-shadow .5s,transform .5s;user-select:none;line-height:1}
.bin.lit{opacity:.95;transform:scale(1.35);color:var(--c,#06B6D4);text-shadow:0 0 10px var(--c,#06B6D4),0 0 22px var(--c,#06B6D4)}
#confetti{position:fixed;inset:0;width:100vw;height:100vh;z-index:80;pointer-events:none}

/* ---------- шапка ---------- */
#hdr{position:fixed;top:0;left:0;right:0;height:var(--hdr);z-index:60;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1.5px solid var(--line)}
.hdr-in{max-width:1280px;margin:0 auto;height:100%;display:flex;align-items:center;gap:12px;padding:0 16px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand-ic{width:40px;height:40px;flex:0 0 40px;border-radius:12px;background:var(--grad-main);display:grid;place-items:center;color:#fff;box-shadow:0 4px 0 #1E3A8A;transition:transform .3s}
.brand:hover .brand-ic{transform:rotate(-8deg) scale(1.06)}
.brand-tx{font-family:'Unbounded';font-weight:700;font-size:13.5px;line-height:1.2;white-space:nowrap}
.brand-tx small{display:block;font-family:'Manrope';font-weight:700;font-size:10.5px;color:var(--muted);letter-spacing:.5px}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.hchip{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border:1.5px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:800;white-space:nowrap;color:var(--indigo)}
.hbtn{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;transition:.18s;color:var(--indigo)}
.hbtn:hover{border-color:var(--cyan);transform:translateY(-2px);box-shadow:0 8px 16px -8px rgba(6,182,212,.5);color:var(--cyan)}
.hbtn[aria-pressed="false"]{opacity:.6;background:var(--surface2)}
#counter{font-family:'JetBrains Mono';font-weight:700;font-size:13px;color:var(--muted)}
#hairline{position:absolute;left:0;bottom:-2px;height:3px;width:0;background:var(--grad-main);background-size:200% 100%;animation:progShift 4s linear infinite;transition:width .45s ease;border-radius:0 3px 3px 0}
@keyframes progShift{to{background-position:200% 0}}

/* ---------- колода слайдов ---------- */
#deck{position:fixed;top:var(--hdr);left:0;right:0;bottom:0;z-index:10}
.slide{position:absolute;inset:0;display:none;flex-direction:column}
.slide.active{display:flex}
.slide.enter-r{animation:inR .45s cubic-bezier(.2,.8,.25,1)}
.slide.enter-l{animation:inL .45s cubic-bezier(.2,.8,.25,1)}
@keyframes inR{from{opacity:0;transform:translateX(46px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-46px)}to{opacity:1;transform:none}}
.slide-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:26px clamp(16px,4vw,52px) 120px}
.wrap{max-width:1180px;margin:0 auto}
.stagger>*{animation:rise .55s cubic-bezier(.2,.8,.25,1) both}
.stagger>*:nth-child(1){animation-delay:.05s}.stagger>*:nth-child(2){animation-delay:.13s}.stagger>*:nth-child(3){animation-delay:.21s}.stagger>*:nth-child(4){animation-delay:.29s}.stagger>*:nth-child(5){animation-delay:.37s}.stagger>*:nth-child(6){animation-delay:.45s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* ---------- нижняя навигация ---------- */
#nav{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border:1.5px solid var(--line);border-radius:999px;padding:8px 12px;box-shadow:0 16px 40px -18px rgba(30,64,175,.4)}
.navbtn{width:44px;height:44px;border-radius:50%;border:none;background:var(--grad-main);color:#fff;display:grid;place-items:center;cursor:pointer;transition:.16s;box-shadow:0 4px 0 #1E3A8A}
.navbtn:hover{filter:brightness(1.08);transform:translateY(-2px)}
.navbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #1E3A8A}
.navbtn:disabled{opacity:.35;pointer-events:none}
.navmid{display:flex;flex-direction:column;align-items:center;min-width:150px;padding:0 6px}
#navLabel{font-weight:800;font-size:13px;color:var(--indigo);white-space:nowrap}
#navSub{font-family:'JetBrains Mono';font-size:11px;color:var(--muted)}
.kbd-hint{position:fixed;right:18px;bottom:22px;z-index:55;font-size:11.5px;font-weight:700;color:var(--muted);background:rgba(255,255,255,.8);border:1.5px solid var(--line);border-radius:999px;padding:5px 12px}
@media (hover:none),(max-width:820px){.kbd-hint{display:none}}

/* ---------- общие карточки / кнопки ---------- */
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:22px;position:relative}
.hud::before,.hud::after{content:'';position:absolute;width:16px;height:16px;border:2.5px solid var(--tc,#2563EB);opacity:.7;pointer-events:none}
.hud::before{top:-2px;left:-2px;border-right:none;border-bottom:none;border-radius:6px 0 0 0}
.hud::after{bottom:-2px;right:-2px;border-left:none;border-top:none;border-radius:0 0 6px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:13px;border:1.5px solid transparent;font-weight:800;font-size:14.5px;cursor:pointer;transition:transform .15s,box-shadow .15s,filter .15s,background .2s,border-color .2s;text-decoration:none;line-height:1.2;user-select:none}
.btn:active{transform:translateY(2px)}
.btn-main{background:var(--grad-main);color:#fff;box-shadow:0 4px 0 #1E3A8A}
.btn-main:hover{filter:brightness(1.07);transform:translateY(-1px)}
.btn-main:active{box-shadow:0 1px 0 #1E3A8A}
.btn-hot{background:var(--grad-hot);color:#fff;box-shadow:0 4px 0 #6D28D9}
.btn-hot:hover{filter:brightness(1.07);transform:translateY(-1px)}
.btn-type{background:linear-gradient(120deg,var(--tc),var(--tc2));color:#fff;box-shadow:0 4px 0 var(--tdeep)}
.btn-type:hover{filter:brightness(1.07);transform:translateY(-1px)}
.btn-ghost{background:#fff;border-color:var(--line2);color:var(--ink)}
.btn-ghost:hover{border-color:var(--cyan);background:var(--surface2);transform:translateY(-1px)}
.btn-sm{padding:8px 14px;font-size:13px;border-radius:10px}
.btn-big{padding:15px 28px;font-size:16px;border-radius:15px}
.btn:disabled{opacity:.45;pointer-events:none}
.kicker{font-family:'JetBrains Mono';font-weight:700;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--tc,var(--indigo));display:flex;align-items:center;gap:8px}
.kicker::before{content:'';width:26px;height:2px;background:linear-gradient(90deg,var(--tc,var(--indigo)),transparent)}
.s-title{font-family:'Unbounded';font-weight:900;font-size:clamp(22px,3.6vw,34px);line-height:1.18;margin:8px 0 6px}
.s-phrase{font-weight:700;color:var(--muted);font-size:15px;font-style:italic}
.typechip{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--tc);background:var(--tbg);color:var(--tdeep);border-radius:999px;padding:5px 13px;font-weight:800;font-size:13px}
.ic{width:20px;height:20px;flex:0 0 auto}
.ic-lg{width:30px;height:30px}

/* ---------- типы информации ---------- */
.t-text{--tc:#0891B2;--tc2:#2563EB;--tbg:#E0F7FA;--tdeep:#0E7490}
.t-image{--tc:#D946EF;--tc2:#7C3AED;--tbg:#FAE8FF;--tdeep:#A21CAF}
.t-sound{--tc:#10B981;--tc2:#84CC16;--tbg:#D1FAE5;--tdeep:#047857}
.t-video{--tc:#F59E0B;--tc2:#EF4444;--tbg:#FEF3C7;--tdeep:#B45309}

/* ---------- титул ---------- */
.title-hero{text-align:center;padding:14px 0 4px;position:relative}
.title-kick{justify-content:center}
.title-kick::before{display:none}
.title-h1{font-family:'Unbounded';font-weight:900;font-size:clamp(30px,6.4vw,62px);line-height:1.08;background:var(--grad-main);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:hueSlide 8s linear infinite alternate;margin:12px 0}
@keyframes hueSlide{to{background-position:100% 0}}
.title-sub{font-size:clamp(15px,2.4vw,19px);font-weight:700;color:var(--muted)}
.title-types{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:20px 0}
.tt{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;border:1.5px solid var(--tc);background:var(--tbg);color:var(--tdeep);font-weight:800;font-size:14px;animation:rise .6s both}
.tt:nth-child(2){animation-delay:.1s}.tt:nth-child(3){animation-delay:.2s}.tt:nth-child(4){animation-delay:.3s}
.author-card{display:flex;align-items:center;gap:16px;max-width:660px;margin:22px auto 0;background:#fff;border:1.5px solid var(--line);border-radius:var(--r-lg);padding:18px 22px;box-shadow:var(--shadow);transform:rotate(-.5deg);transition:transform .3s}
.author-card:hover{transform:rotate(0)}
.avatar{width:66px;height:66px;flex:0 0 66px;border-radius:50%;background:var(--grad-hot);display:grid;place-items:center;font-size:32px;box-shadow:0 5px 0 #6D28D9}
.a-small{font-family:'JetBrains Mono';font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--magenta)}
.a-name{font-weight:800;font-size:18px;line-height:1.3}
.a-role{color:var(--muted);font-weight:700;font-size:13.5px}
.title-meta{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:20px 0 6px}
.title-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.encode-ticker{font-family:'JetBrains Mono';font-size:13px;color:var(--cyan);background:#0E1526;border-radius:999px;padding:7px 18px;display:inline-flex;gap:10px;align-items:center;margin-top:18px;box-shadow:0 0 24px -6px rgba(6,182,212,.6)}
.encode-ticker .cur{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* ---------- разделители ---------- */
.divider{min-height:calc(100vh - var(--hdr) - 150px);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.div-num{font-family:'JetBrains Mono';font-weight:700;font-size:13px;letter-spacing:3px;color:var(--tc);text-transform:uppercase}
.div-icon{width:92px;height:92px;border-radius:26px;background:linear-gradient(135deg,var(--tc),var(--tc2));display:grid;place-items:center;color:#fff;margin:18px 0;box-shadow:0 10px 0 var(--tdeep),0 24px 50px -18px var(--tc);animation:bob 3s ease-in-out infinite alternate}
.div-icon .ic{width:46px;height:46px}
@keyframes bob{to{transform:translateY(-10px) rotate(3deg)}}
.div-phrase{font-family:'Unbounded';font-weight:700;font-size:clamp(20px,4vw,36px);line-height:1.25;max-width:820px;background:linear-gradient(120deg,var(--tc),var(--tc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.div-sub{margin-top:14px;font-weight:700;color:var(--muted);font-size:15.5px;max-width:640px}
.bin-marquee{margin-top:26px;font-family:'JetBrains Mono';font-size:13px;color:var(--tc);opacity:.55;letter-spacing:3px;overflow:hidden;max-width:90vw;white-space:nowrap}
.bin-marquee span{display:inline-block;animation:marq 18s linear infinite}
@keyframes marq{to{transform:translateX(-50%)}}

/* ---------- теория ---------- */
.theory-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:18px;margin-top:18px;align-items:start}
.formula-card{overflow:hidden}
.formula-card::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(6,182,212,.07) 48%,transparent 62%);background-size:250% 100%;animation:scan 5s linear infinite;pointer-events:none}
@keyframes scan{to{background-position:-250% 0}}
.formula-big{font-family:'JetBrains Mono';font-weight:700;font-size:clamp(26px,4.4vw,42px);letter-spacing:1px;margin:14px 0 4px;color:var(--ink)}
.formula-big .v{color:var(--tdeep)}
.formula-bar{height:5px;border-radius:99px;background:linear-gradient(90deg,var(--tc),var(--tc2));width:180px;margin:8px 0 16px;box-shadow:0 0 16px -2px var(--tc)}
.formula-2{font-family:'JetBrains Mono';font-weight:600;font-size:16px;color:var(--tdeep);background:var(--tbg);border:1.5px dashed var(--tc);border-radius:10px;padding:8px 14px;display:inline-block;margin-bottom:14px}
.legend{display:flex;flex-direction:column;gap:9px}
.leg{display:flex;gap:11px;align-items:flex-start;font-size:14.5px;font-weight:600}
.leg b{font-family:'JetBrains Mono';font-weight:700;color:var(--tdeep);background:var(--tbg);border:1.5px solid var(--tc);border-radius:8px;min-width:38px;text-align:center;padding:2px 7px;flex:0 0 auto}
.note{margin-top:14px;background:var(--surface2);border:1.5px solid var(--line);border-left:4px solid var(--tc);border-radius:10px;padding:11px 14px;font-size:13.5px;font-weight:600;color:var(--muted)}
.demo-card h3{font-family:'Unbounded';font-size:15px;display:flex;align-items:center;gap:9px;margin-bottom:4px}
.demo-sub{font-size:12.5px;color:var(--muted);font-weight:700;margin-bottom:14px}
.ctrl{margin-bottom:13px}
.ctrl label{display:flex;justify-content:space-between;font-weight:800;font-size:13px;margin-bottom:6px}
.ctrl label output{font-family:'JetBrains Mono';color:var(--tdeep)}
.ctrl input[type=range]{width:100%;accent-color:var(--tc);height:26px;cursor:pointer}
.ctrl select,.ctrl input[type=text]{width:100%;border:1.5px solid var(--line2);border-radius:10px;padding:9px 12px;font:inherit;font-weight:700;font-size:14px;background:#fff;color:var(--ink)}
.ctrl select:focus,.ctrl input[type=text]:focus{outline:none;border-color:var(--tc);box-shadow:0 0 0 3px color-mix(in srgb,var(--tc) 20%,transparent)}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1.5px solid var(--line2);background:#fff;border-radius:10px;padding:8px;font-weight:800;font-size:13px;cursor:pointer;transition:.15s}
.seg button.on{border-color:var(--tc);background:var(--tbg);color:var(--tdeep);box-shadow:0 0 0 3px color-mix(in srgb,var(--tc) 16%,transparent)}
.demo-out{background:#0E1526;border-radius:13px;padding:14px 16px;color:#E6EDF7;font-family:'JetBrains Mono';font-size:13.5px;display:flex;flex-direction:column;gap:6px;box-shadow:inset 0 0 30px rgba(6,182,212,.08)}
.demo-out .row{display:flex;justify-content:space-between;gap:10px}
.demo-out .k{color:#8FA3C4}
.demo-out .val{color:#67E8F9;font-weight:700}
.demo-out .val.big{color:#F0ABFC;font-size:16px}
.pixgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;margin:4px 0 12px;border-radius:10px;overflow:hidden}
.pixgrid i{aspect-ratio:1;border-radius:3px;transition:background .35s}
.wave{width:100%;height:64px;margin-bottom:10px}
.filmstrip{display:flex;gap:5px;margin-bottom:12px;overflow:hidden}
.filmstrip i{flex:0 0 34px;height:44px;border-radius:6px;background:linear-gradient(135deg,var(--tbg),#fff);border:1.5px solid var(--tc);position:relative;animation:framePulse 1.6s ease-in-out infinite}
.filmstrip i::after{content:'▶';position:absolute;inset:0;display:grid;place-items:center;color:var(--tdeep);font-size:11px}
@keyframes framePulse{50%{box-shadow:0 0 12px -2px var(--tc)}}
.code-line{font-family:'JetBrains Mono';font-size:12.5px;color:var(--tdeep);background:var(--tbg);border-radius:8px;padding:7px 10px;margin-top:10px;word-break:break-all}

/* ---------- разбор задач ---------- */
.worked-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
.prob-card{display:flex;flex-direction:column}
.prob-badge{display:inline-flex;align-items:center;gap:7px;font-family:'JetBrains Mono';font-weight:700;font-size:11.5px;letter-spacing:1.5px;color:var(--tdeep);background:var(--tbg);border:1.5px solid var(--tc);border-radius:999px;padding:4px 12px;align-self:flex-start;text-transform:uppercase}
.prob-text{font-weight:700;font-size:15px;margin:12px 0;line-height:1.6}
.prob-text b{color:var(--tdeep);font-family:'JetBrains Mono';font-weight:700}
.given{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.given span{font-family:'JetBrains Mono';font-size:12px;font-weight:600;background:var(--surface2);border:1.5px solid var(--line);border-radius:8px;padding:4px 9px;color:var(--muted)}
.reveal-btn{align-self:flex-start}
.steps{display:none;margin-top:14px;flex-direction:column;gap:8px}
.steps.open{display:flex}
.step{display:flex;gap:11px;align-items:flex-start;background:var(--surface2);border:1.5px solid var(--line);border-radius:11px;padding:10px 13px;animation:rise .45s both}
.step .n{font-family:'JetBrains Mono';font-weight:700;font-size:11px;color:#fff;background:linear-gradient(135deg,var(--tc),var(--tc2));border-radius:7px;min-width:26px;height:26px;display:grid;place-items:center;flex:0 0 auto}
.step .tx{font-size:13.5px;font-weight:600;line-height:1.5}
.step .tx .mono{color:var(--tdeep);font-weight:700}
.answer-chip{display:none;align-self:flex-start;margin-top:12px;align-items:center;gap:9px;background:linear-gradient(120deg,var(--tc),var(--tc2));color:#fff;font-weight:800;font-size:15px;border-radius:12px;padding:10px 18px;box-shadow:0 5px 0 var(--tdeep);animation:selPop .4s cubic-bezier(.2,.9,.3,1.4)}
.answer-chip.show{display:inline-flex}
.answer-chip .mono{font-size:17px}
@keyframes selPop{0%{transform:scale(.7)}60%{transform:scale(1.06)}100%{transform:scale(1)}}

/* ---------- общая схема ---------- */
.scheme-flow{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin:20px 0 8px}
.snode{background:#fff;border:1.5px solid var(--line2);border-radius:14px;padding:12px 20px;font-weight:800;font-size:15px;box-shadow:var(--shadow);text-align:center}
.snode.hub{background:#0E1526;color:#67E8F9;border-color:#0E1526;font-family:'JetBrains Mono';box-shadow:0 0 30px -6px rgba(6,182,212,.55);position:relative;overflow:hidden}
.snode.hub .bits{display:block;font-size:12px;color:#F0ABFC;letter-spacing:2px;animation:blink 1.4s steps(1) infinite}
.sarrow{color:var(--indigo);font-size:22px;animation:nudge 1.4s ease-in-out infinite alternate}
@keyframes nudge{to{transform:translateX(5px)}}
.branches{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px;position:relative}
.branch{border-top:5px solid var(--tc);cursor:pointer;transition:transform .2s,box-shadow .2s}
.branch:hover{transform:translateY(-6px);box-shadow:0 22px 44px -20px var(--tc)}
.branch .bhead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.branch .bic{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--tc),var(--tc2));color:#fff;display:grid;place-items:center;flex:0 0 auto}
.branch h4{font-family:'Unbounded';font-size:14.5px}
.branch .bform{font-family:'JetBrains Mono';font-weight:700;font-size:14px;color:var(--tdeep);background:var(--tbg);border-radius:9px;padding:8px 10px;margin:8px 0}
.branch .bparams{font-size:12.5px;font-weight:600;color:var(--muted);line-height:1.5}
.branch .blink{margin-top:10px;font-size:12px;font-weight:800;color:var(--tdeep);display:inline-flex;align-items:center;gap:5px}
.uni-rules{margin-top:18px;background:#0E1526;border-radius:var(--r-lg);padding:18px 22px;color:#E6EDF7;display:flex;flex-wrap:wrap;gap:12px 26px;align-items:center;justify-content:center;box-shadow:0 0 40px -10px rgba(37,99,235,.5)}
.uni-rules .u{font-family:'JetBrains Mono';font-size:14px;font-weight:600}
.uni-rules .u b{color:#67E8F9}
.uni-rules .u.hot b{color:#F0ABFC}
.ladder{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center}
.ladder .lu{background:rgba(103,232,249,.12);border:1px solid rgba(103,232,249,.4);color:#67E8F9;border-radius:8px;padding:4px 10px;font-family:'JetBrains Mono';font-size:12.5px;font-weight:700}
.ladder .la{color:#F0ABFC;font-size:11px;font-family:'JetBrains Mono'}

/* ---------- практикум ---------- */
.pr-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.ege-badge{font-family:'JetBrains Mono';font-weight:700;font-size:11.5px;letter-spacing:1px;background:#0E1526;color:#67E8F9;border-radius:999px;padding:5px 13px;box-shadow:0 0 18px -4px rgba(6,182,212,.6)}
.pr-count{font-weight:800;font-size:13px;color:var(--muted)}
.pr-card{margin-top:14px}
.pr-card.solved{border-color:var(--green);box-shadow:0 0 0 3px rgba(16,185,129,.18),var(--shadow)}
.pr-card.wrongshake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.pr-statement{font-size:clamp(15.5px,2.2vw,18px);font-weight:700;line-height:1.7;margin:14px 0 18px}
.pr-statement b{font-family:'JetBrains Mono';color:var(--tdeep);background:var(--tbg);border-radius:6px;padding:1px 6px;font-weight:700}
.answer-row{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.ans-input{flex:1;min-width:150px;border:2px solid var(--line2);border-radius:13px;padding:13px 16px;font-family:'JetBrains Mono';font-weight:700;font-size:19px;background:#fff;color:var(--ink);transition:.18s}
.ans-input:focus{outline:none;border-color:var(--tc);box-shadow:0 0 0 4px color-mix(in srgb,var(--tc) 18%,transparent)}
.ans-unit{display:flex;align-items:center;font-weight:800;font-size:14px;color:var(--tdeep);background:var(--tbg);border:1.5px solid var(--tc);border-radius:13px;padding:0 16px;white-space:nowrap}
.pr-feedback{margin-top:14px;font-weight:800;font-size:15px;min-height:26px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.pr-feedback.ok{color:var(--green)}
.pr-feedback.bad{color:var(--red)}
.pr-feedback.warn{color:var(--amber)}
.pr-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.pr-meta .mchip{font-size:12px;font-weight:800;color:var(--muted);background:var(--surface2);border:1.5px solid var(--line);border-radius:999px;padding:4px 11px}
.pr-next{display:none;margin-top:14px}
.pr-next.show{display:inline-flex;animation:rise .4s both}
.solved-stamp{position:absolute;top:14px;right:16px;font-size:26px;transform:rotate(12deg);display:none;animation:selPop .5s both}
.pr-card.solved .solved-stamp{display:block}

/* ---------- оценивание ---------- */
.assess-grid{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.aq{border-left:5px solid var(--qc,var(--indigo))}
.aq .tag{font-family:'JetBrains Mono';font-size:10.5px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--qc,var(--indigo));background:color-mix(in srgb,var(--qc,var(--indigo)) 10%,#fff);border:1.5px solid color-mix(in srgb,var(--qc,var(--indigo)) 40%,#fff);border-radius:999px;padding:3px 11px;display:inline-block;margin-bottom:8px}
.aq h4{font-size:15.5px;font-weight:800;margin-bottom:12px;line-height:1.45}
.aq.miss{border-color:var(--red);animation:shake .4s}
.opts-col{display:flex;flex-direction:column;gap:8px}
.optbtn{display:flex;align-items:center;gap:11px;text-align:left;border:1.5px solid var(--line2);background:#fff;border-radius:12px;padding:11px 14px;font-weight:700;font-size:14px;cursor:pointer;transition:.15s}
.optbtn:hover{border-color:var(--qc,var(--indigo));transform:translateX(3px)}
.optbtn.sel{border-color:var(--qc,var(--indigo));background:color-mix(in srgb,var(--qc,var(--indigo)) 9%,#fff);box-shadow:0 0 0 3px color-mix(in srgb,var(--qc,var(--indigo)) 15%,transparent)}
.optbtn .dot{width:20px;height:20px;flex:0 0 20px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;font-size:11px;color:#fff;transition:.15s}
.optbtn.sel .dot{background:var(--qc,var(--indigo));border-color:var(--qc,var(--indigo))}
.emoji-row{display:flex;gap:8px;flex-wrap:wrap}
.emobtn{flex:1;min-width:96px;border:1.5px solid var(--line2);background:#fff;border-radius:13px;padding:11px 6px;text-align:center;cursor:pointer;transition:.15s}
.emobtn:hover{transform:translateY(-3px);border-color:var(--qc,var(--indigo))}
.emobtn.sel{border-color:var(--qc,var(--indigo));background:color-mix(in srgb,var(--qc,var(--indigo)) 9%,#fff);box-shadow:0 0 0 3px color-mix(in srgb,var(--qc,var(--indigo)) 15%,transparent);transform:scale(1.03)}
.emobtn .e{font-size:27px;display:block}
.emobtn.sel .e{animation:bob 1.5s ease-in-out infinite alternate}
.emobtn .t{font-size:11.5px;font-weight:800;color:var(--muted);display:block;margin-top:3px}
.emobtn.sel .t{color:var(--qc,var(--indigo))}
.fav-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.favchip{border:1.5px solid var(--line2);background:#fff;border-radius:999px;padding:7px 14px;font-weight:800;font-size:13px;cursor:pointer;transition:.15s}
.favchip.sel{border-color:var(--magenta);background:#FAE8FF;color:#A21CAF}
.assess-id{display:grid;grid-template-columns:1.4fr .6fr;gap:12px}
.assess-id input,.assess-id select{border:1.5px solid var(--line2);border-radius:12px;padding:12px 14px;font:inherit;font-weight:700;font-size:15px;background:#fff}
.assess-id input:focus,.assess-id select:focus{outline:none;border-color:var(--indigo);box-shadow:0 0 0 3px rgba(79,70,229,.15)}
textarea{width:100%;border:1.5px solid var(--line2);border-radius:12px;padding:12px 14px;font:inherit;font-weight:600;font-size:14.5px;resize:vertical;min-height:84px;background:#fff}
textarea:focus{outline:none;border-color:var(--magenta);box-shadow:0 0 0 3px rgba(217,70,239,.15)}
.send-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:18px}
.send-status{font-weight:800;font-size:14px;flex:1;min-width:220px}
.send-status.ok{color:var(--green)}.send-status.bad{color:var(--amber)}.send-status.err{color:var(--red)}
.tiny{font-size:12px;color:var(--muted);font-weight:600;margin-top:10px}
details.tiny summary{cursor:pointer;font-weight:800;color:var(--indigo)}
details.tiny p{margin-top:6px}
.field-err{color:var(--red);font-weight:800;font-size:13px;margin-top:6px}

/* ---------- финал ---------- */
.final-hero{text-align:center;padding:10px 0}
.final-emoji{font-size:64px;animation:bob 2.4s ease-in-out infinite alternate;display:inline-block}
.final-h{font-family:'Unbounded';font-weight:900;font-size:clamp(26px,5vw,44px);background:var(--grad-main);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:hueSlide 7s linear infinite alternate;margin:10px 0}
.final-phrase{font-weight:700;color:var(--muted);font-size:16px;max-width:640px;margin:0 auto}
.final-chips{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin:22px 0}
.fchip{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:800;font-size:14px;box-shadow:var(--shadow)}
.fchip.good{border-color:var(--green);color:var(--green);background:#ECFDF5}
.final-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:8px}

/* ---------- кот Шрёдингера ---------- */
#catLayer{position:fixed;left:0;right:0;bottom:6px;height:120px;z-index:58;pointer-events:none;overflow:hidden}
#catRun{position:absolute;bottom:0;left:-180px;width:150px;pointer-events:auto;cursor:pointer;display:none;filter:drop-shadow(0 6px 10px rgba(37,99,235,.3))}
#catRun.run{display:block;animation:catCross var(--dur,7s) linear forwards}
#catRun.rev.run{animation-name:catCrossRev}
@keyframes catCross{from{transform:translateX(0)}to{transform:translateX(calc(100vw + 360px))}}
@keyframes catCrossRev{from{transform:translateX(calc(100vw + 360px)) scaleX(-1)}to{transform:translateX(0) scaleX(-1)}}
#catRun .catbody{animation:catBob .32s ease-in-out infinite alternate}
@keyframes catBob{to{transform:translateY(-4px)}}
#catRun .leg{transform-origin:top center;animation:legSwing .3s ease-in-out infinite alternate}
#catRun .leg.l2{animation-delay:-.15s}#catRun .leg.l3{animation-delay:-.08s}#catRun .leg.l4{animation-delay:-.22s}
@keyframes legSwing{from{transform:rotate(24deg)}to{transform:rotate(-24deg)}}
#catRun .tail{transform-origin:left center;animation:tailWag .5s ease-in-out infinite alternate}
@keyframes tailWag{from{transform:rotate(-12deg)}to{transform:rotate(16deg)}}
#catRun .ghost{animation:quantum 1.1s steps(2) infinite}
@keyframes quantum{0%,49%{opacity:.55}50%,100%{opacity:.08}}
#catRun .catlabel{font-family:'JetBrains Mono';font-size:10px;fill:#7C3AED;font-weight:700}
#catRun.collapsed .ghost{display:none}
#catRun.collapsed .catbody{animation:none}
#catRun.collapsed .leg,#catRun.collapsed .tail{animation:none}

/* ---------- обзор слайдов ---------- */
#overview{position:fixed;inset:0;z-index:90;background:var(--scrim);backdrop-filter:blur(4px);display:none;place-items:center;padding:20px}
#overview.open{display:grid;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}}
.ov-card{background:#fff;border:1.5px solid var(--line);border-radius:var(--r-lg);max-width:960px;width:100%;max-height:86vh;display:flex;flex-direction:column;box-shadow:0 40px 90px -30px rgba(14,21,38,.6);animation:rise .3s both}
.ov-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1.5px solid var(--line)}
.ov-head h3{font-family:'Unbounded';font-size:17px}
.ov-grid{overflow-y:auto;padding:18px 22px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.ov-item{display:flex;gap:10px;align-items:center;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;cursor:pointer;transition:.15s;border-left:4px solid var(--oc,var(--indigo))}
.ov-item:hover{transform:translateY(-2px);border-color:var(--oc,var(--indigo));box-shadow:0 10px 20px -12px var(--oc,var(--indigo))}
.ov-item.cur{background:var(--surface2);border-color:var(--oc,var(--indigo));box-shadow:0 0 0 3px color-mix(in srgb,var(--oc,var(--indigo)) 18%,transparent)}
.ov-item .n{font-family:'JetBrains Mono';font-weight:700;font-size:12px;color:var(--oc,var(--indigo));min-width:24px}
.ov-item .t{font-weight:800;font-size:12.5px;line-height:1.3}
.ov-item .s{font-size:10.5px;color:var(--muted);font-weight:700}

/* ---------- тосты ---------- */
#toasts{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);z-index:95;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(94vw,540px);pointer-events:none}
.toast{pointer-events:auto;background:#0E1526;color:#E6EDF7;border:1.5px solid rgba(103,232,249,.4);border-radius:999px;padding:10px 20px;font-weight:700;font-size:13.5px;box-shadow:0 0 30px -6px rgba(6,182,212,.5);animation:toastIn .32s cubic-bezier(.2,.9,.3,1.3);max-width:100%;text-align:center}
.toast.out{animation:toastOut .3s forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.92)}}
@keyframes toastOut{to{opacity:0;transform:translateY(10px) scale(.95)}}

/* ---------- адаптив ---------- */
@media (max-width:900px){
  .theory-grid,.worked-grid{grid-template-columns:1fr}
  .branches{grid-template-columns:repeat(2,1fr)}
  .brand-tx small{display:none}
}
@media (max-width:640px){
  :root{--hdr:56px}
  .brand-tx{font-size:11.5px}
  .hchip.pr{display:none}
  #counter{display:none}
  .slide-body{padding:18px 14px 110px}
  .card{padding:16px}
  .branches{grid-template-columns:1fr}
  .assess-id{grid-template-columns:1fr}
  .navmid{min-width:110px}
  #navLabel{font-size:12px}
  .navbtn{width:40px;height:40px}
  .emobtn{min-width:72px}
  .answer-row{flex-direction:column}
  .ans-unit{padding:10px 16px;justify-content:center}
  .divider{min-height:calc(100vh - var(--hdr) - 130px)}
  #catRun{width:110px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
  .bin-marquee span{animation:none}
}
</style>
</head>
<body>

<script>
'use strict';
/* ============================== ДАННЫЕ ============================== */
const AUTHOR='Соловьянюк-Кротова Валентина Григорьевна';
const EMAIL='val-sk@yandex.ru';
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;

function saveDraft(){clearTimeout(saveT);saveT=setTimeout(()=>store.set(LS,{practice:S.practice,assess:S.assess,sent:S.sent,sentAt:S.sentAt}),350)}

  const v=bytes/b[1];return (v%1===0?nf(v):v.toLocaleString('ru-RU',{maximumFractionDigits:2}))+' '+b[0]}

/* ---------- звук ---------- */
const FX={ctx:null,on:true,
  ensure(){if(!this.on)return null;if(!this.ctx){try{this.ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){this.on=false;return null}}if(this.ctx.state==='suspended')this.ctx.resume();return this.ctx},
  tone(f,d,type,vol,delay,slide){const c=this.ensure();if(!c)return;const t=c.currentTime+(delay||0);const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.09,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.05)},
  blip(){this.tone(660,.07,'sine',.07,0,990)},
  whoosh(){this.tone(240,.14,'sine',.05,0,90)},
  tick(){this.tone(880,.05,'square',.035)},
  good(){[523,659,784,1047].forEach((f,i)=>this.tone(f,.16,'triangle',.09,i*.09))},
  bad(){this.tone(180,.2,'sawtooth',.05,0,120)},
  fanfare(){[523,659,784,1047,1319].forEach((f,i)=>this.tone(f,.22,'triangle',.1,i*.11))},
  meow(){this.tone(700,.12,'sine',.07,0,1100);this.tone(900,.16,'sine',.06,.12,500)},

};

const Conf={cv:null,cx:null,parts:[],raf:0,
  ensure(){if(!this.cv){this.cv=$('confetti');this.cx=this.cv.getContext('2d')}const d=Math.min(devicePixelRatio||1,2);this.cv.width=innerWidth*d;this.cv.height=innerHeight*d;this.cx.setTransform(d,0,0,d,0,0)},
  burst(x,y,n){if(REDUCED)return;this.ensure();const cols=['#2563EB','#06B6D4','#D946EF','#10B981','#F59E0B','#7C3AED','#EF4444'];
    for(let i=0;i<n;i++){const a=Math.random()*6.28,sp=3+Math.random()*8;this.parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-4,g:.22,s:4+Math.random()*6,c:pick(cols),r:Math.random()*6.3,vr:(Math.random()-.5)*.3,rect:Math.random()<.5,life:90+Math.random()*60})}
    if(!this.raf)this.loop()},
  loop(){this.raf=requestAnimationFrame(()=>this.loop());const cx=this.cx;cx.clearRect(0,0,innerWidth,innerHeight);this.parts=this.parts.filter(p=>p.life>0&&p.y<innerHeight+40);
    if(!this.parts.length){cancelAnimationFrame(this.raf);this.raf=0;return}
    for(const p of this.parts){p.vy+=p.g;p.x+=p.vx;p.vx*=.985;p.y+=p.vy;p.r+=p.vr;p.life--;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.globalAlpha=Math.min(1,p.life/35);cx.fillStyle=p.c;if(p.rect)cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);else{cx.beginPath();cx.arc(0,0,p.s/2,0,6.3);cx.fill()}cx.restore()}}
};

function buildBins(){const L=$('binLayer');L.innerHTML='';bins=[];
  const cols=Math.max(8,Math.ceil(innerWidth/46)),rows=Math.max(6,Math.ceil(innerHeight/52));
  L.style.gridTemplateColumns=`repeat(${cols},1fr)`;L.style.gridTemplateRows=`repeat(${rows},1fr)`;

  for(let i=0;i<total;i++){const s=document.createElement('span');s.className='bin';s.textContent=Math.random()<.5?'0':'1';s.style.justifySelf=pick(['start','center','end']);L.appendChild(s);bins.push(s)}}
function lightBins(n){const cols=['#06B6D4','#D946EF','#2563EB','#10B981','#F59E0B'];
  for(let i=0;i<n;i++){const s=pick(bins);if(!s||s.classList.contains('lit'))continue;s.style.setProperty('--c',pick(cols));s.classList.add('lit');setTimeout(()=>s.classList.remove('lit'),900+Math.random()*700)}}

    <div class="ctrl"><label>Каналы k</label><div class="seg"><button type="button" data-k="1">🎤 Моно · 1</button><button type="button" data-k="2" class="on">🎧 Стерео · 2</button></div></div>

function bindDemo(node,k){
  const body=node.querySelector('[data-demobody]');body.innerHTML=demoBody(k);
  const out=body.querySelector('[data-out]');
  const row=(a,b,big)=>`<div class="row"><span class="k">${a}</span><span class="val${big?' big':''}">${b}</span></div>`;
  if(k==='text'){
    const txt=body.querySelector('[data-in=txt]'),enc=body.querySelector('[data-in=enc]'),ko=body.querySelector('[data-o=k]'),code=body.querySelector('[data-code]');
    const upd=()=>{const s=txt.value,K=[...s].length,i=+enc.value,bits=K*i;ko.textContent=K+' симв.';
      out.innerHTML=row('K — символов',nf(K))+row('i — бит/символ',i)+row('I = K · i',nf(bits)+' бит')+row('В байтах',nf(bits/8)+' Б')+row('Объём',bestUnit(bits/8),1);
      const ch=[...s][0];if(ch){const cp=ch.codePointAt(0);const bin=cp.toString(2).padStart(i,'0').slice(-i);const grouped=bin.match(/.{1,8}/g).join(' ');
        code.textContent=`«${ch}» → U+${cp.toString(16).toUpperCase().padStart(4,'0')} → ${grouped}`}else code.textContent='Введи символ — увидишь его код ✍️'};
    txt.addEventListener('input',upd);enc.addEventListener('change',upd);upd();
  }
  if(k==='image'){
    const pix=body.querySelector('[data-pix]'),depth=body.querySelector('[data-in=depth]'),res=body.querySelector('[data-in=res]'),io=body.querySelector('[data-o=i]');
    for(let i=0;i<64;i++)pix.appendChild(document.createElement('i'));
    const cells=[...pix.children];
    const upd=()=>{const i=+depth.value,r=+res.value,N=2**i;io.textContent=i+' бит';
      cells.forEach((c,ci)=>{const x=ci%8,y=(ci/8)|0;const idx=(x*3+y*5+x*y)%N;const hue=Math.round(idx*360/N);c.style.background=`hsl(${hue} 85% ${55+(idx%3)*8}%)`});
      const bits=r*r*i;out.innerHTML=row('Палитра N = 2ⁱ',nf(N)+' цветов')+row('Пикселей W·H',nf(r*r))+row('I = W·H·i',nf(bits)+' бит')+row('Объём',bestUnit(bits/8),1)};
    depth.addEventListener('input',upd);res.addEventListener('change',upd);upd();
  }
  if(k==='sound'){
    const f=body.querySelector('[data-in=f]'),ii=body.querySelector('[data-in=i]'),t=body.querySelector('[data-in=t]'),to=body.querySelector('[data-o=t]'),wave=body.querySelector('[data-wave]');let kk=2;
    const segs=body.querySelectorAll('[data-k]');segs.forEach(b=>b.addEventListener('click',()=>{kk=+b.dataset.k;segs.forEach(x=>x.classList.toggle('on',x===b));FX.click();upd()}));
    const upd=()=>{const F=+f.value,I=+ii.value,T=+t.value;to.textContent=T+' с';
      const bits=F*I*kk*T;out.innerHTML=row('Поток f·i·k',nf(F*I*kk/8)+' Б/с')+row('I = f·i·k·t',nf(bits)+' бит')+row('Объём',bestUnit(bits/8),1);
      const dots=Math.min(60,Math.max(8,F/1000*1.2));let path='M0 32 ';for(let x=0;x<=300;x+=6)path+=`L${x} ${32+Math.sin(x/22)*20} `;
      let circles='';for(let d=0;d<dots;d++){const x=d*300/(dots-1);const y=32+Math.sin(x/22)*20;circles+=`<circle cx="${x}" cy="${y}" r="2.6" fill="#10B981"/>`}
      wave.innerHTML=`<path d="${path}" fill="none" stroke="#10B981" stroke-width="2" opacity=".5"/>${circles}`};
    f.addEventListener('change',upd);ii.addEventListener('change',upd);t.addEventListener('input',upd);upd();
  }
  if(k==='video'){
    const res=body.querySelector('[data-in=res]'),depth=body.querySelector('[data-in=depth]'),fps=body.querySelector('[data-in=fps]'),t=body.querySelector('[data-in=t]'),fo=body.querySelector('[data-o=fps]'),to=body.querySelector('[data-o=t]'),film=body.querySelector('[data-film]');let snd=0;
    const segs=body.querySelectorAll('[data-snd]');segs.forEach(b=>b.addEventListener('click',()=>{snd=+b.dataset.snd;segs.forEach(x=>x.classList.toggle('on',x===b));FX.click();upd()}));
    const upd=()=>{const [w,h]=res.value.split('x').map(Number),d=+depth.value,F=+fps.value,T=+t.value;fo.textContent=F+' fps';to.textContent=T+' с';
      const bv=w*h*d*F*T,bs=snd?16000*16*2*T:0;
      out.innerHTML=row('Кадр',bestUnit(w*h*d/8))+row('Видеоряд',bestUnit(bv/8))+row('Звук',snd?bestUnit(bs/8):'—')+row('Итого',bestUnit((bv+bs)/8),1);
      const n=Math.min(12,F);film.innerHTML='';for(let i=0;i<n;i++){const el=document.createElement('i');el.style.animationDelay=(i*.12)+'s';film.appendChild(el)}};
    res.addEventListener('change',upd);depth.addEventListener('change',upd);fps.addEventListener('input',upd);t.addEventListener('input',upd);upd();
  }
}

/* ============================== СБОРКА КОЛОДЫ ============================== */
const deck=$('deck');const slideEls=[];
function buildDeck(){
  SLIDES.forEach((s,i)=>{const el=document.createElement('section');el.className='slide';el.dataset.i=i;el.setAttribute('aria-label',s.title);
    el.innerHTML=`<div class="slide-body"><div class="wrap-outer">${s.html}</div></div>`;deck.appendChild(el);slideEls.push(el)});
  slideEls.forEach((el,i)=>{
    el.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>goto(+b.dataset.go)));
    const demo=el.querySelector('[data-demo]');if(demo)bindDemo(demo,demo.dataset.demo);
    el.querySelectorAll('[data-worked]').forEach(card=>{
      const btn=card.querySelector('[data-reveal]'),steps=card.querySelector('.steps'),ans=card.querySelector('.answer-chip');
      btn.addEventListener('click',()=>{const open=steps.classList.toggle('open');ans.classList.toggle('show',open);
        btn.innerHTML=open?IC.eye+' Скрыть разбор':IC.eye+' Показать разбор решения';if(open){FX.tick();lightBins(6)}});
    });
    el.querySelectorAll('[data-branch]').forEach(b=>{const k=b.dataset.branch;const target=SLIDES.findIndex(s=>s.sec===k&&s.label.endsWith('формула'));
      const go=()=>goto(target);b.addEventListener('click',go);b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}})});
    const pr=el.querySelector('[data-pr]');if(pr)bindPractice(pr,el,i);

}

/* ---------- практикум ---------- */
function solvedCount(){return PRACTICE.filter(p=>S.practice[p.id].solved).length}
function updatePrChips(){const c=solvedCount();$('prChip').textContent=`⚡ ${c}/8`;
  document.querySelectorAll('[data-prprogress]').forEach(e=>e.textContent=`Решено: ${c}/8`)}
function bindPractice(card,el,idx){
  const pid=card.dataset.pr,p=PRACTICE.find(x=>x.id===pid),st=S.practice[pid];
  const input=card.querySelector('[data-ans]'),fb=card.querySelector('[data-fb]'),att=card.querySelector('[data-attempts]'),next=card.querySelector('[data-next]'),btn=card.querySelector('[data-check]');
  input.value=st.value;att.textContent='Попыток: '+st.attempts;
  if(st.solved){card.classList.add('solved');fb.className='pr-feedback ok';fb.innerHTML='✅ Уже решено! Отличная работа.';next.classList.add('show')}
  input.addEventListener('input',()=>{st.value=input.value;saveDraft()});
  input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();check()}});
  btn.addEventListener('click',check);
  next.addEventListener('click',()=>goto(Math.min(idx+1,SLIDES.length-1)));
  function check(){
    const raw=input.value.replace(/\s/g,'').replace(',','.');
    if(raw===''){fb.className='pr-feedback warn';fb.innerHTML='✍️ Введи число — и нажми «Ответ»';card.classList.remove('wrongshake');void card.offsetWidth;card.classList.add('wrongshake');FX.bad();return}
    const val=Number(raw);st.attempts++;att.textContent='Попыток: '+st.attempts;
    if(Number.isFinite(val)&&val===p.answer){
      st.solved=true;card.classList.add('solved');fb.className='pr-feedback ok';fb.innerHTML=pick(GOOD);next.classList.add('show');
      FX.good();const r=btn.getBoundingClientRect();Conf.burst(r.left+r.width/2,r.top+r.height/2,70);lightBins(14);
      if(Math.random()<.3)runCat();updatePrChips();saveDraft();
    }else{
      fb.className='pr-feedback bad';fb.innerHTML=pick(BAD);card.classList.remove('wrongshake');void card.offsetWidth;card.classList.add('wrongshake');FX.bad();saveDraft();
    }
  }
}

/* ---------- оценивание ---------- */
function assessLabel(q,v){if(v==null)return '—';if(q.kind==='radio')return q.opts[v];if(q.kind==='emoji')return q.opts[v][0]+' '+q.opts[v][1];return v||'—'}
function contentScore(){let c=0;ASSESS.filter(q=>q.kind==='radio').forEach(q=>{if(S.assess[q.id]===q.correct)c++});return c}
function assessReport(){
  const a=S.assess,lines=[];
  lines.push('════════════════════════════════════════');
  lines.push('📊 ФОРМИРУЮЩЕЕ ОЦЕНИВАНИЕ · КОДИРОВАНИЕ ИНФОРМАЦИИ · 10 КЛАСС');
  lines.push('Автор: '+AUTHOR+', учитель информатики и ИИ');
  lines.push('════════════════════════════════════════');
  lines.push('Ученик: '+(a.name||'—')+(a.klass?' · '+a.klass:''));
  lines.push('Дата: '+new Date().toLocaleString('ru-RU'));
  lines.push('Практикум (ЕГЭ №7): решено '+solvedCount()+' из 8');
  PRACTICE.forEach(p=>{const st=S.practice[p.id];lines.push(`  ${TYPES[p.type].name} №${p.n}: ${st.solved?'✅ решено':'⬜ не решено'} (попыток: ${st.attempts})`)});
  lines.push('');lines.push('СОДЕРЖАТЕЛЬНАЯ ЧАСТЬ (верных: '+contentScore()+' из 2)');
  ASSESS.forEach(q=>{lines.push(q.id.toUpperCase()+' ['+q.tag+'] '+q.q);lines.push('  Ответ: '+assessLabel(q,a[q.id]))});
  lines.push('Любимый вид кодирования: '+(a.fav?TYPES[a.fav].name:'—'));
  lines.push('');lines.push('Отправлено автоматически · '+EMAIL);
  return lines.join('\r\n')}
function mailHref(){const a=S.assess;const body=`Здравствуйте, Валентина Григорьевна!\n\nФормирующее оценивание по теме «Кодирование информации» (10 класс).\n\nУченик: ${a.name||'—'}${a.klass?' · '+a.klass:''}\nПрактикум: ${solvedCount()}/8\nСодержание: ${contentScore()}/2 верных\n\nQ1: ${assessLabel(ASSESS[0],a.q1)}\nQ2: ${assessLabel(ASSESS[1],a.q2)}\nQ3: ${assessLabel(ASSESS[2],a.q3)}\nQ4: ${assessLabel(ASSESS[3],a.q4)}\nQ5: ${a.q5||'—'}\nЛюбимый вид: ${a.fav?TYPES[a.fav].name:'—'}`;
  return `mailto:${EMAIL}?subject=${encodeURIComponent('📊 Оценивание · Кодирование информации · 10кл · '+(a.name||'ученик'))}&body=${encodeURIComponent(body)}`}
function bindAssess(){
  const el=slideEls[SLIDES.findIndex(s=>s.label==='Формирующее оценивание')];
  const name=el.querySelector('#aName'),klass=el.querySelector('#aKlass');
  name.value=S.assess.name;klass.value=S.assess.klass;
  name.addEventListener('input',()=>{S.assess.name=name.value;saveDraft()});
  klass.addEventListener('change',()=>{S.assess.klass=klass.value;saveDraft()});
  ASSESS.forEach(q=>{const card=el.querySelector(`[data-aq=${q.id}]`);
    if(q.kind==='open'){const ta=card.querySelector('[data-open]');ta.value=S.assess.q5||'';
      ta.addEventListener('input',()=>{S.assess.q5=ta.value;saveDraft()});
      card.querySelectorAll('[data-fav]').forEach(b=>{b.classList.toggle('sel',S.assess.fav===b.dataset.fav);
        b.addEventListener('click',()=>{S.assess.fav=S.assess.fav===b.dataset.fav?null:b.dataset.fav;card.querySelectorAll('[data-fav]').forEach(x=>x.classList.toggle('sel',S.assess.fav===x.dataset.fav));FX.click();saveDraft()})});
    }else{card.querySelectorAll('[data-opt]').forEach(b=>{const v=+b.dataset.opt;b.classList.toggle('sel',S.assess[q.id]===v);
      b.addEventListener('click',()=>{S.assess[q.id]=v;card.querySelectorAll('[data-opt]').forEach(x=>x.classList.toggle('sel',+x.dataset.opt===v));card.classList.remove('miss');FX.click();saveDraft()})})}
  });
  const status=el.querySelector('#sendStatus'),mail=el.querySelector('#btnMail');
  mail.href=mailHref();
  if(S.sent){status.className='send-status ok';status.innerHTML=`✅ Отправлено ${S.sentAt}. Можно отправить повторно.`}
  el.querySelector('#btnSend').addEventListener('click',()=>sendAssess(el));
  el.querySelector('#btnCopy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(assessReport());toast('Ответы скопированы 📋')}catch(e){toast('Не удалось скопировать 😔 скачай файл')}});
  el.querySelector('#btnDown').addEventListener('click',downloadAssess);
}
function downloadAssess(){try{const blob=new Blob(['\uFEFF'+assessReport()],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`Оценивание_10кл_${(S.assess.name||'ученик').replace(/[^\wА-Яа-яЁё-]+/g,'_')}.txt`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('Файл сохранён 💾')}catch(e){toast('Скачивание заблокировано 😔')}}
async function sendAssess(el){
  const err=el.querySelector('#aNameErr'),status=el.querySelector('#sendStatus');
  const name=S.assess.name.trim();
  let bad=false;
  if(name.length<2){err.textContent='Напиши имя и фамилию — хотя бы 2 буквы 🙂';err.hidden=false;el.querySelector('#aName').focus();bad=true}else err.hidden=true;
  ASSESS.forEach(q=>{if(q.kind!=='open'&&S.assess[q.id]==null){const c=el.querySelector(`[data-aq=${q.id}]`);c.classList.remove('miss');void c.offsetWidth;c.classList.add('miss');bad=true}});
  if(bad){status.className='send-status err';status.innerHTML='⚠️ Заполни имя и отметь ответы в вопросах 1–4.';FX.bad();return}
  status.className='send-status';status.innerHTML='⏳ Отправляем письмо учителю…';
  const payload={_subject:`📊 Оценивание · Кодирование информации · 10кл · ${name}`,_captcha:'false',_template:'table',
    'Ученик':name,'Класс':S.assess.klass||'—','Дата':new Date().toLocaleString('ru-RU'),
    'Практикум ЕГЭ №7':`решено ${solvedCount()} из 8`,'Содержательная часть':`${contentScore()} из 2 верных`,
    'Q1 · общее в формулах':assessLabel(ASSESS[0],S.assess.q1),'Q2 · что не влияет на звук':assessLabel(ASSESS[1],S.assess.q2),
    'Q3 · самооценка единиц':assessLabel(ASSESS[2],S.assess.q3),'Q4 · эмоции':assessLabel(ASSESS[3],S.assess.q4),
    'Q5 · комментарий':S.assess.q5||'—','Любимый вид кодирования':S.assess.fav?TYPES[S.assess.fav].name:'—',
    'Полный отчёт':assessReport()};
  let ok=false;
  try{const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),15000);
    const res=await fetch('https://formsubmit.co/ajax/'+EMAIL,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(payload),signal:ctl.signal});
    clearTimeout(to);const j=await res.json().catch(()=>null);ok=res.ok&&j&&(j.success==='true'||j.success===true);
  }catch(e){ok=false}
  if(ok){S.sent=true;S.sentAt=new Date().toLocaleString('ru-RU');saveDraft();
    status.className='send-status ok';status.innerHTML=`✅ Отправлено на ${EMAIL}! Спасибо за обратную связь 💜`;
    FX.fanfare();Conf.burst(innerWidth/2,innerHeight*.4,150);toast('Оценивание отправлено учителю ✅');updateFinal();
    el.querySelector('#btnMail').href=mailHref();
  }else{status.className='send-status bad';status.innerHTML=navigator.onLine?'⚠️ Автоотправка не сработала. Нажми «Отправить письмом» — письмо уже готово.':'📡 Нет интернета. Скачай файл или отправь письмо, когда сеть появится.';FX.bad();el.querySelector('#btnMail').href=mailHref()}
}

/* ============================== НАВИГАЦИЯ ============================== */
function goto(i,dir){
  i=Math.max(0,Math.min(SLIDES.length-1,i));
  const prev=S.idx;S.idx=i;
  slideEls.forEach((el,k)=>{el.classList.toggle('active',k===i);el.classList.remove('enter-r','enter-l')});
  const el=slideEls[i];void el.offsetWidth;el.classList.add(dir===undefined?(i>=prev?'enter-r':'enter-l'):(dir>0?'enter-r':'enter-l'));
  el.querySelector('.slide-body').scrollTop=0;
  $('counter').textContent=String(i+1).padStart(2,'0')+' / '+SLIDES.length;
  $('navLabel').textContent=SLIDES[i].label;$('navSub').textContent='slide '+String(i+1).padStart(2,'0');
  $('hairline').style.width=((i+1)/SLIDES.length*100)+'%';
  $('navPrev').disabled=i===0;$('navNext').disabled=i===SLIDES.length-1;
  try{history.replaceState(null,'','#s='+(i+1))}catch(e){}
  lightBins(10);FX.whoosh();
  if(SLIDES[i].sec==='practice'||SLIDES[i].label.includes('переход')){if(Math.random()<.35)runCat()}
  if(SLIDES[i].sec==='final'){updateFinal();if(solvedCount()>=6||S.sent)setTimeout(()=>Conf.burst(innerWidth/2,innerHeight*.35,120),400)}
  markOverview();
}
function next(){if(S.idx<SLIDES.length-1)goto(S.idx+1,1)}
function prev(){if(S.idx>0)goto(S.idx-1,-1)}
function buildOverview(){
  const g=$('ovGrid');g.innerHTML=SLIDES.map((s,i)=>`<button type="button" class="ov-item" data-ov="${i}" style="--oc:${secColor[s.sec]}"><span class="n">${String(i+1).padStart(2,'0')}</span><span><span class="t">${s.title}</span><br><span class="s">${s.label}</span></span></button>`).join('');
  g.querySelectorAll('[data-ov]').forEach(b=>b.addEventListener('click',()=>{closeOverview();goto(+b.dataset.ov)}));
}
function markOverview(){document.querySelectorAll('[data-ov]').forEach(b=>b.classList.toggle('cur',+b.dataset.ov===S.idx))}
function openOverview(){S.ovOpen=true;$('overview').classList.add('open');markOverview();$('ovClose').focus()}
function closeOverview(){S.ovOpen=false;$('overview').classList.remove('open')}

/* ============================== ИНИЦИАЛИЗАЦИЯ ============================== */
function ticker(){const chars=['А','Б','В','Ж','Ю','Я','Σ','π','♥','0','1'];let i=0;
  setInterval(()=>{if(document.hidden)return;i=(i+1)%chars.length;const ch=chars[i];const c=$('tickChar'),code=$('tickCode');if(!c)return;
    c.textContent=ch;const cp=ch.codePointAt(0);code.textContent=cp.toString(2).padStart(8,'0')},1600)}
function init(){
  loadDraft();
  S.sound=store.get(LSS)!==false;FX.on=S.sound;updateSoundBtn();
  $('brandIc').innerHTML=IC.chip;$('btnOverview').innerHTML=IC.grid;$('navPrev').innerHTML=IC.left;$('navNext').innerHTML=IC.right;
  buildDeck();buildOverview();buildBins();startBins();ticker();updatePrChips();
  $('navPrev').addEventListener('click',prev);$('navNext').addEventListener('click',next);
  $('btnOverview').addEventListener('click',openOverview);$('ovClose').addEventListener('click',closeOverview);
  $('overview').addEventListener('click',e=>{if(e.target===$('overview'))closeOverview()});
  $('btnSound').addEventListener('click',()=>{S.sound=!S.sound;FX.on=S.sound;store.set(LSS,S.sound);updateSoundBtn();if(S.sound)FX.blip();toast(S.sound?'Звук включён 🔊':'Звук выключен 🔇')});
  $('btnCat').addEventListener('click',()=>{runCat();toast('Кот Шрёдингера вышел на прогулку 🐱📦')});
  $('catRun').addEventListener('click',collapseCat);
  document.addEventListener('keydown',e=>{
    if(S.ovOpen){if(e.key==='Escape')closeOverview();return}
    const tag=e.target.tagName;if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT')return;
    if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();next()}
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev()}
    else if(e.key==='Home'){e.preventDefault();goto(0)}
    else if(e.key==='End'){e.preventDefault();goto(SLIDES.length-1)}
    else if(e.key==='Escape'){openOverview()}
  });
  let tx=0,ty=0;
  deck.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
  deck.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
    if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.4){if(dx<0)next();else prev()}},{passive:true});
  let rT=0;window.addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(()=>{buildBins();if(Conf.raf)Conf.ensure()},250)});
  const m=location.hash.match(/s=(\d+)/);const start=m?Math.min(Math.max(+m[1]-1,0),SLIDES.length-1):0;
  goto(start);scheduleCat();
  setTimeout(()=>lightBins(16),600);
}
init();
