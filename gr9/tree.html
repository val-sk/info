<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08140e">
<title>Дерево · Перебор вариантов — 9 класс</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ============ ПАЛИТРА «НОЧНОЙ ЦИФРОВОЙ ЛЕС» ============ */
:root{
  --bg0:#060f0b; --bg1:#0a1a13; --surface:#0f241b; --surface2:#153226;
  --line:rgba(126,231,160,.16); --line2:rgba(126,231,160,.3);
  --ink:#f1ecdd; --muted:#9fb8a8; --dim:#6f8779;
  --pine:#1c5c3e; --emerald:#2ea36b; --lime:#8ef07f;
  --amber:#ffb324; --amber2:#ff8a3d; --cyan:#3fd6ff; --magenta:#ff5da2;
  --ok:#57e389; --warn:#ffb324; --bad:#ff6257; --info:#3fd6ff;
  --gold:linear-gradient(135deg,#ffc247,#ff8a3d);
  --stage-c:#8ef07f; --stage-soft:rgba(142,240,127,.07);
  --disp:'Unbounded','Arial Black',system-ui,sans-serif;
  --body:'Manrope','Segoe UI',system-ui,sans-serif;
  --mono:'JetBrains Mono','Consolas',monospace;
}
body[data-stage="0"]{--stage-c:#8ef07f;--stage-soft:rgba(142,240,127,.08)}
body[data-stage="1"]{--stage-c:#3fd6ff;--stage-soft:rgba(63,214,255,.07)}
body[data-stage="2"]{--stage-c:#8ef07f;--stage-soft:rgba(142,240,127,.07)}
body[data-stage="3"]{--stage-c:#ffb324;--stage-soft:rgba(255,179,36,.07)}
body[data-stage="4"]{--stage-c:#ff5da2;--stage-soft:rgba(255,93,162,.06)}
body[data-stage="5"]{--stage-c:#ffb324;--stage-soft:rgba(255,179,36,.08)}
body[data-stage="6"]{--stage-c:#3fd6ff;--stage-soft:rgba(63,214,255,.07)}
body[data-stage="7"]{--stage-c:#8ef07f;--stage-soft:rgba(142,240,127,.09)}

*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  font-family:var(--body); color:var(--ink); overflow:hidden;
  background:
    radial-gradient(1200px 800px at 85% -10%, rgba(63,214,255,.10), transparent 60%),
    radial-gradient(1000px 700px at -10% 30%, rgba(46,163,107,.17), transparent 60%),
    radial-gradient(900px 600px at 70% 110%, rgba(255,179,36,.09), transparent 60%),
    linear-gradient(180deg,#08140e,#060f0b 45%,#081209);
  -webkit-font-smoothing:antialiased;
}
::selection{background:rgba(255,179,36,.35)}
button{font-family:inherit;color:inherit}
b{font-weight:800}
.mono{font-family:var(--mono)}
.dim{color:var(--dim)}
.grad{background:linear-gradient(100deg,#ffc247 5%,#8ef07f 45%,#3fd6ff 95%);-webkit-background-clip:text;background-clip:text;color:transparent}

.slide,.tscroll,textarea{scrollbar-width:thin;scrollbar-color:#2ea36b #0a1a13}
.slide::-webkit-scrollbar,.tscroll::-webkit-scrollbar,textarea::-webkit-scrollbar{width:10px;height:10px}
.slide::-webkit-scrollbar-track,.tscroll::-webkit-scrollbar-track,textarea::-webkit-scrollbar-track{background:#0a1a13;border-radius:99px}
.slide::-webkit-scrollbar-thumb,.tscroll::-webkit-scrollbar-thumb,textarea::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#2ea36b,#1c5c3e);border-radius:99px;border:2px solid #0a1a13}
.slide::-webkit-scrollbar-thumb:hover,.tscroll::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,#ffb324,#ff8a3d)}

.aurora{position:fixed;border-radius:50%;filter:blur(75px);z-index:0;pointer-events:none;opacity:.55}
.a1{width:52vw;height:52vw;left:-14vw;top:-16vw;background:radial-gradient(circle,rgba(46,163,107,.35),transparent 65%);animation:drift1 26s ease-in-out infinite alternate}
.a2{width:44vw;height:44vw;right:-12vw;top:22vh;background:radial-gradient(circle,rgba(63,214,255,.22),transparent 65%);animation:drift2 32s ease-in-out infinite alternate}
.a3{width:46vw;height:46vw;left:26vw;bottom:-22vw;background:radial-gradient(circle,rgba(255,150,50,.16),transparent 65%);animation:drift3 38s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(9vw,7vh) scale(1.12)}}
@keyframes drift2{to{transform:translate(-7vw,-6vh) scale(.92)}}
@keyframes drift3{to{transform:translate(-9vw,-5vh) scale(1.15)}}
#bg{position:fixed;inset:0;z-index:1;pointer-events:none}
#fx{position:fixed;inset:0;z-index:60;pointer-events:none}
.grain{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.05;
  background-image:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='160'%20height='160'%3E%3Cfilter%20id='n'%3E%3CfeTurbulence%20type='fractalNoise'%20baseFrequency='0.9'%20numOctaves='2'/%3E%3CfeColorMatrix%20values='0%200%200%200%201%200%200%200%200%201%200%200%200%200%201%200%200%200%200.6%200'/%3E%3C/filter%3E%3Crect%20width='160'%20height='160'%20filter='url(%23n)'/%3E%3C/svg%3E");}

#topbar{position:fixed;top:0;left:0;right:0;height:62px;z-index:50;display:flex;align-items:center;gap:16px;padding:0 18px;
  background:rgba(8,18,13,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;color:#c9ffce;
  background:linear-gradient(150deg,#1c5c3e,#0f241b);border:1px solid var(--line2);box-shadow:0 0 16px rgba(142,240,127,.25)}
.tt{line-height:1.15;white-space:nowrap}
.tt b{font:700 12px var(--disp);letter-spacing:.6px;text-transform:uppercase;display:block}
.tt span{font:500 10px var(--mono);color:var(--dim);letter-spacing:1px}
#segs{display:flex;gap:5px;flex:1;max-width:640px;margin:0 auto;min-width:90px}
.seg{height:9px;border-radius:99px;background:#11251b;border:1px solid rgba(126,231,160,.1);overflow:hidden;cursor:pointer;position:relative;transition:.2s}
.seg:hover{transform:scaleY(1.35)}
.seg.cur{border-color:var(--line2);box-shadow:0 0 10px rgba(142,240,127,.2)}
.seg-f{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#2ea36b,#8ef07f);transition:width .4s ease}
.seg.cur .seg-f{background:linear-gradient(90deg,#ffb324,#ff8a3d)}
.scorechip{display:flex;align-items:center;gap:6px;font:700 13px var(--mono);color:var(--amber);background:rgba(255,179,36,.08);
  border:1px solid rgba(255,179,36,.35);border-radius:99px;padding:7px 13px;cursor:pointer;transition:.2s;white-space:nowrap}
.scorechip:hover{background:rgba(255,179,36,.16);transform:translateY(-1px)}
.scorechip.pop{animation:scorepop .45s cubic-bezier(.2,1.6,.3,1)}
@keyframes scorepop{40%{transform:scale(1.18)}}
#sndbtn{width:38px;height:38px;flex:none;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;color:var(--lime);transition:.2s}
#sndbtn:hover{border-color:var(--line2);transform:translateY(-1px)}
#sndbtn.off{color:var(--dim)}

#deck{position:fixed;inset:0;z-index:3}
.slide{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:86px 22px 112px;height:100vh;height:100dvh}
.slide::before{content:'';position:absolute;inset:0;background:radial-gradient(900px 480px at 82% 0%,var(--stage-soft),transparent 70%);pointer-events:none}
.wrap{max-width:1140px;margin:0 auto;position:relative}
.slide.leaving{animation:fadeout .18s both}
@keyframes fadeout{to{opacity:0;transform:translateY(-12px)}}
.slide.active .rise{opacity:0;animation:rise .55s cubic-bezier(.2,.8,.25,1) forwards;animation-delay:calc(var(--i,0)*75ms + 60ms)}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

.kicker{font:700 11px var(--mono);letter-spacing:2.5px;text-transform:uppercase;color:var(--stage-c);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.kicker::before{content:'';width:26px;height:2px;background:var(--stage-c);border-radius:2px;box-shadow:0 0 8px var(--stage-c)}
h2.stitle{font:700 clamp(21px,3.4vw,34px)/1.2 var(--disp);margin:10px 0 6px;letter-spacing:-.3px}
.slead{color:var(--muted);font-size:15px;max-width:760px;line-height:1.55}
.qhead{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
.typebadge{font:700 10px var(--mono);letter-spacing:1.5px;text-transform:uppercase;padding:6px 11px;border-radius:99px;border:1px solid var(--line2);color:var(--stage-c);background:rgba(255,255,255,.02);white-space:nowrap}
.ptsbadge{font:700 11px var(--mono);letter-spacing:1px;padding:7px 12px;border-radius:99px;color:var(--amber);border:1px solid rgba(255,179,36,.4);background:rgba(255,179,36,.08);white-space:nowrap}
.rules{font-size:12px;color:var(--dim);margin-top:8px}
.card{background:linear-gradient(160deg,rgba(23,52,38,.72),rgba(13,31,23,.92));border:1px solid var(--line);border-radius:18px;padding:20px}
.ic{flex:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 14px/1.2 var(--body);padding:12px 20px;border-radius:12px;
  border:1px solid var(--line);background:var(--surface2);color:var(--ink);cursor:pointer;transition:.18s;user-select:none;white-space:nowrap}
.btn:hover{transform:translateY(-1px);border-color:var(--line2);box-shadow:0 6px 18px rgba(0,0,0,.35)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.btn.primary{background:var(--gold);color:#2a1602;border-color:transparent;box-shadow:0 6px 22px rgba(255,150,40,.25)}
.btn.primary:hover{box-shadow:0 10px 28px rgba(255,150,40,.42)}
.btn.ghost{background:transparent}
.btn.big{padding:15px 26px;font-size:15px;border-radius:14px}
.btn.sm{padding:9px 14px;font-size:13px}
.btn.wide{width:100%;white-space:normal;text-align:center}
.btn.attn{animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,179,36,.5)}55%{box-shadow:0 0 0 12px rgba(255,179,36,0)}}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:8px}

.hero{display:grid;grid-template-columns:1.04fr .96fr;gap:34px;align-items:center;min-height:60vh}
.hero-title{font:900 clamp(30px,5.4vw,58px)/1.06 var(--disp);letter-spacing:-1px;margin:14px 0 14px}
.hero-sub{color:var(--muted);font-size:clamp(14px,1.6vw,17px);line-height:1.6;max-width:520px}
.namecard{margin-top:22px;background:linear-gradient(160deg,rgba(23,52,38,.8),rgba(13,31,23,.95));border:1px solid var(--line2);border-radius:18px;padding:20px;display:grid;gap:12px;max-width:520px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.nf{display:grid;gap:6px}
.nf label{font:700 11px var(--mono);letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.nf-row{display:grid;grid-template-columns:1fr 110px;gap:12px}
input.tin,textarea.tin{width:100%;background:#0a1b13;border:1.5px solid var(--line);border-radius:11px;padding:12px 14px;color:var(--ink);font:600 15px var(--body);transition:.2s}
input.tin:focus,textarea.tin:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(255,179,36,.15);outline:none}
input.err,textarea.err,.lvlrow.err{border-color:var(--bad)!important;animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.name-hint{font-size:12px;color:var(--dim);display:flex;gap:6px;align-items:center}
.hero-meta{margin-top:16px;font:500 11px var(--mono);color:var(--dim);letter-spacing:.4px;line-height:1.8}
.hero-right{filter:drop-shadow(0 24px 50px rgba(0,0,0,.4))}
.flowstrip{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:34px}
.flowchip{border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:rgba(15,36,27,.6);font-size:12px;color:var(--muted);line-height:1.4}
.flowchip b{display:block;font:700 12px var(--mono);color:var(--stage-c);margin-bottom:3px}

.hero-tree{width:100%;height:auto;display:block}
.hero-tree .edge{stroke:rgba(142,240,127,.65);stroke-width:2.6;fill:none;stroke-dasharray:290;stroke-dashoffset:290;filter:drop-shadow(0 0 5px rgba(142,240,127,.4))}
.slide.active .hero-tree .edge{animation:draw .8s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.hero-tree .pop{transform-box:fill-box;transform-origin:center;transform:scale(0)}
.slide.active .hero-tree .pop{animation:pop .55s cubic-bezier(.2,1.5,.3,1) forwards}
@keyframes pop{to{transform:scale(1)}}
.hero-tree .fade{opacity:0}
.slide.active .hero-tree .fade{animation:fadein .5s ease forwards}
@keyframes fadein{to{opacity:1}}
.hero-tree .ncircle{fill:#123125;stroke:var(--emerald);stroke-width:2.2}
.hero-tree .leafc{fill:#2b2109;stroke:var(--amber);stroke-width:2.4;animation:leafglow 3s ease-in-out infinite alternate}
@keyframes leafglow{from{filter:drop-shadow(0 0 3px rgba(255,179,36,.4))}to{filter:drop-shadow(0 0 10px rgba(255,179,36,.8))}}
.hero-tree text{font-family:var(--mono)}
.hero-tree .nl{fill:var(--ink);font-weight:700;font-size:16px}
.hero-tree .ll{fill:var(--amber);font-weight:700;font-size:14px}
.hero-tree .el{fill:var(--cyan);font-weight:700;font-size:11px}
.hero-tree .cap{fill:var(--dim);font-size:10px;letter-spacing:1.5px}
.hero-tree .echip{fill:#0b1d15;stroke:rgba(63,214,255,.4)}

.gsvg{width:100%;height:auto;display:block}
.gsvg .edge line,.gsvg .edge path{stroke:rgba(63,214,255,.5);stroke-width:2.5;transition:.25s;fill:none}
.gsvg .edge.lit line,.gsvg .edge.lit path{stroke:var(--amber);stroke-width:4;filter:drop-shadow(0 0 6px rgba(255,179,36,.6))}
.gsvg .node circle{fill:#123125;stroke:var(--emerald);stroke-width:2.2;transition:.25s}
.gsvg .node.lit circle{stroke:var(--amber);fill:#33270e;filter:drop-shadow(0 0 8px rgba(255,179,36,.5))}
.gsvg .node text{fill:var(--ink);font:700 15px var(--mono)}
.gsvg .wchip rect{fill:#0b1d15;stroke:var(--line2)}
.gsvg .wchip text{fill:var(--amber);font:700 12px var(--mono)}
.tsvg .tedge path{stroke:rgba(142,240,127,.5);stroke-width:2.5;fill:none;transition:.25s}
.tsvg .tedge.lit path{stroke:var(--amber);stroke-width:3.6;filter:drop-shadow(0 0 6px rgba(255,179,36,.55))}
.tsvg .tnode circle{fill:#123125;stroke:var(--emerald);stroke-width:2.2;transition:.25s}
.tsvg .tnode.leaf circle{fill:#2b2109;stroke:var(--amber)}
.tsvg .tnode.lit circle{stroke:var(--amber);fill:#33270e;filter:drop-shadow(0 0 8px rgba(255,179,36,.5))}
.tsvg .tnode text{fill:var(--ink);font:700 13px var(--mono)}
.tsvg .tnode.leaf text{fill:var(--amber)}
.tsvg .tcol{fill:var(--dim);font:700 10px var(--mono);letter-spacing:1.2px;text-transform:uppercase}
[data-paths],[data-edge],[data-node]{transition:opacity .25s}
.hovering [data-paths]:not(.lit),.hovering [data-edge]:not(.lit),.hovering [data-node]:not(.lit){opacity:.24}
#anatsvg [data-part]{transition:.25s}
#anatsvg .lit circle{stroke:var(--amber)!important;fill:#33270e!important;filter:drop-shadow(0 0 8px rgba(255,179,36,.6))}
#anatsvg .lit path,#anatsvg .lit line{stroke:var(--amber)!important}
#anatsvg .lit text{fill:var(--amber)!important}

/* весовая матрица */
.wmatrix{border-collapse:collapse;margin:0 auto;font-family:var(--mono)}
.wmatrix th{font:700 13px var(--mono);color:var(--stage-c);padding:8px 10px;text-align:center}
.wmatrix thead th{border-bottom:2px solid var(--line2)}
.wmatrix tbody th{border-right:2px solid var(--line2)}
.wmatrix td{width:46px;height:42px;text-align:center;border:1px solid rgba(126,231,160,.1);font:700 14px var(--mono);color:var(--ink);transition:.15s}
.wmatrix td.mdiag{color:var(--dim);background:rgba(126,231,160,.04)}
.wmatrix td.mempty{background:rgba(6,15,11,.45)}
.wmatrix td.mcell{color:var(--cyan)}
.wmatrix td.mcell:not(.mstatic){cursor:pointer}
.wmatrix td.mcell:hover,.wmatrix td.mcell-lit{background:rgba(255,179,36,.18);color:var(--amber);box-shadow:inset 0 0 0 1.5px var(--amber)}
.rc3{grid-template-columns:repeat(3,1fr)}
.algo{list-style:none;counter-reset:a;display:grid;gap:11px}
.algo li{counter-increment:a;position:relative;padding-left:36px;font-size:13.5px;line-height:1.5;color:var(--muted)}
.algo li::before{content:counter(a);position:absolute;left:0;top:-1px;width:25px;height:25px;border-radius:50%;background:var(--gold);color:#2a1602;font:700 12px var(--mono);display:grid;place-items:center}
.algo li b{color:var(--ink)}

.qbody{margin-top:18px}
.match-grid{display:grid;grid-template-columns:1fr 1.25fr;gap:14px}
.mcol{display:grid;gap:9px;align-content:start}
.mcol-h{font:700 10px var(--mono);letter-spacing:2px;text-transform:uppercase;color:var(--dim);padding-left:4px}
.mitem{display:flex;align-items:center;gap:10px;text-align:left;width:100%;padding:12px 13px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--surface);cursor:pointer;font:600 13.5px/1.35 var(--body);transition:.18s;min-height:52px}
.mitem:hover:not(:disabled){transform:translateY(-1px);border-color:var(--line2)}
.mitem.sel{border-color:var(--amber);box-shadow:0 0 0 3px rgba(255,179,36,.18),0 0 18px rgba(255,179,36,.2)}
.mitem.paired{border-color:var(--pc);box-shadow:0 0 14px -5px var(--pc)}
.mitem:disabled{cursor:default;opacity:1}
.mitem.good{border-color:var(--ok);background:rgba(87,227,137,.07)}
.mitem.badf{border-color:var(--bad);background:rgba(255,98,87,.06)}
.mitem .mt{flex:1;overflow-wrap:anywhere}
.pchip{width:23px;height:23px;flex:none;border-radius:50%;display:grid;place-items:center;font:700 12px var(--mono);background:var(--pc,#1a3527);color:#08130d}
.pchip.empty{background:transparent;border:1.5px dashed var(--line2);color:transparent}
.mres{flex:none;display:grid;place-items:center}
.mitem.good .mres{color:var(--ok)}.mitem.badf .mres{color:var(--bad)}
.qfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;flex-wrap:wrap}
.cnt{font:700 12px var(--mono);color:var(--muted);letter-spacing:.5px}
.score-pill{font:700 13px var(--mono);padding:9px 15px;border-radius:99px}
.score-pill.ok{color:var(--ok);border:1px solid rgba(87,227,137,.5);background:rgba(87,227,137,.08)}
.score-pill.mid{color:var(--warn);border:1px solid rgba(255,179,36,.5);background:rgba(255,179,36,.08)}
.score-pill.bad{color:var(--bad);border:1px solid rgba(255,98,87,.5);background:rgba(255,98,87,.08)}

.pool{display:flex;flex-wrap:wrap;gap:9px;min-height:66px;padding:13px;border:1.5px dashed var(--line2);border-radius:14px;background:rgba(10,27,19,.5);align-content:flex-start;transition:.2s}
.pool.await{border-color:var(--amber);box-shadow:0 0 0 3px rgba(255,179,36,.1)}
.pool-h{font:700 10px var(--mono);letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin:0 0 8px 4px}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:13px}
.bin{border:1.5px solid var(--line);border-radius:14px;padding:12px;min-height:128px;transition:.2s;cursor:pointer;align-content:start;display:flex;flex-wrap:wrap;gap:8px}
.bin-h{width:100%;display:flex;align-items:center;gap:8px;font:800 13px var(--body);margin-bottom:2px}
.bin.yes .bin-h,.bin.tree .bin-h{color:var(--ok)}
.bin.no .bin-h{color:var(--bad)}
.bin.yes,.bin.tree{border-color:rgba(87,227,137,.3)}
.bin.no{border-color:rgba(255,98,87,.3)}
.bin.await{border-style:dashed;border-color:var(--amber);box-shadow:0 0 0 3px rgba(255,179,36,.1)}
.chip{display:inline-flex;align-items:center;gap:7px;padding:9px 12px;border-radius:99px;border:1.5px solid var(--line2);background:var(--surface2);
  font:600 12.5px/1.3 var(--body);cursor:pointer;transition:.18s;text-align:left;overflow-wrap:anywhere}
.chip:hover:not(:disabled){transform:translateY(-1px);border-color:var(--amber)}
.chip.sel{border-color:var(--amber);box-shadow:0 0 0 3px rgba(255,179,36,.18)}
.chip:disabled{cursor:default;opacity:1}
.chip.good{border-color:var(--ok);background:rgba(87,227,137,.1)}
.chip.badf{border-color:var(--bad);background:rgba(255,98,87,.09)}
.chip-x{font:700 14px var(--mono);color:var(--dim);padding:0 2px;border-radius:6px}
.chip-x:hover{color:var(--bad)}

function buildTree(seqs){
  const root={label:seqs[0][0],depth:0,children:[],paths:[]};
  seqs.forEach((s,ri)=>{
    let n=root;n.paths.push(ri);
    for(let d=1;d<s.length;d++){
      let c=n.children.find(x=>x.label===s[d]);
      if(!c){c={label:s[d],depth:d,children:[],paths:[]};n.children.push(c);}
      c.paths.push(ri);n=c;
    }
    n.leaf=true;n.leafIndex=ri;
  });
  let row=0,maxD=0;
  (function lay(n){maxD=Math.max(maxD,n.depth);
    if(!n.children.length){n.row=row++;}
    else{n.children.forEach(lay);n.row=(n.children[0].row+n.children[n.children.length-1].row)/2;}
  })(root);
  return {root,rows:row,maxD};
}
function treeSVG(T,o){

  (function walk(n){
    const x=padX+n.depth*colW,y=padY+n.row*rowH;
    nodes.push({n,x,y});
    n.children.forEach(c=>{edges.push({n,c,x,y,cx:padX+c.depth*colW,cy:padY+c.row*rowH});walk(c);});
  })(T.root);
  let s='';
  if(o.colTitles){s+=o.colTitles.map((t,d)=>{
    const last=d===o.colTitles.length-1;
    const anch=d===0?'start':last?'end':'middle';
    const tx=d===0?8:last?W-8:padX+d*colW;
    return `<text class="tcol" x="${tx}" y="18" text-anchor="${anch}">${t}</text>`;}).join('');}
  s+=edges.map(e=>{
    const d=`M ${e.x+r} ${e.y} C ${(e.x+e.cx)/2} ${e.y}, ${(e.x+e.cx)/2} ${e.cy}, ${e.cx-(e.c.leaf?rl:r)} ${e.cy}`;

    if(o.weights){const k=[e.n.label,e.c.label].sort().join('');const w=o.weights[k];
      if(w!=null){const mx=(e.x+e.cx)/2,my=(e.y+e.cy)/2;
        chip=`<g class="wchip"><rect x="${mx-12}" y="${my-9}" width="24" height="18" rx="6"/><text x="${mx}" y="${my+4}" text-anchor="middle">${w}</text></g>`;}}
    return `<g class="tedge" data-paths="${e.c.paths.join(',')}"><path d="${d}"/>${chip}</g>`;
  }).join('');
  s+=nodes.map(({n,x,y})=>{
    const rr=n.leaf?rl:r;
    let label=n.label;
    if(n.leaf&&o.leafCombine)label=o.seqs[n.leafIndex].slice(1).join('');
    const hov=n.leaf&&o.hover?` data-route="${n.leafIndex}"`:'';
    return `<g class="tnode${n.leaf?' leaf':''}" data-paths="${n.paths.join(',')}"${hov}><circle cx="${x}" cy="${y}" r="${rr}"/><text x="${x}" y="${y+4.5}" text-anchor="middle">${label}</text></g>`;
  }).join('');

function tone(f,o={}){

  const osc=c.createOscillator(),g=c.createGain(),t0=c.currentTime+t;
  osc.type=type;osc.frequency.setValueAtTime(f,t0);

  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+.012);

}

const bgC=$('bg'),fxC=$('fx'),bgX=bgC.getContext('2d'),fxX=fxC.getContext('2d');
let VW=0,VH=0,DPR=1,mouseNX=.5,mouseNY=.5;
const flies=[],leaves=[],sparks=[];
const FLY_COLORS=['255,190,80','140,240,140','80,215,255'];
const CONF_COLORS=['#ffb324','#8ef07f','#3fd6ff','#ff5da2','#57e389','#ff8a3d'];
const sprites=FLY_COLORS.map(c=>{
  const cv=document.createElement('canvas');cv.width=cv.height=64;
  const x=cv.getContext('2d'),g=x.createRadialGradient(32,32,2,32,32,30);
  g.addColorStop(0,`rgba(${c},.95)`);g.addColorStop(.35,`rgba(${c},.35)`);g.addColorStop(1,`rgba(${c},0)`);
  x.fillStyle=g;x.fillRect(0,0,64,64);return cv;
});
function sizeCanvases(){
  VW=innerWidth;VH=innerHeight;DPR=Math.min(devicePixelRatio||1,2);
  [bgC,fxC].forEach(c=>{c.width=VW*DPR;c.height=VH*DPR;c.style.width=VW+'px';c.style.height=VH+'px';});
  bgX.setTransform(DPR,0,0,DPR,0,0);fxX.setTransform(DPR,0,0,DPR,0,0);
}
function seedFlies(){
  flies.length=0;
  const n=VW<640?34:60;
  for(let i=0;i<n;i++)flies.push({x:Math.random()*VW,y:Math.random()*VH,r:1+Math.random()*2.4,s:Math.floor(Math.random()*3),
    ph:Math.random()*6.28,sp:.4+Math.random()*.8,vx:(Math.random()-.5)*.22,vy:(Math.random()-.5)*.18,dp:.3+Math.random()*.7});
}
function drawBg(t){
  bgX.clearRect(0,0,VW,VH);
  const ox=(mouseNX-.5)*14,oy=(mouseNY-.5)*10;
  flies.forEach(f=>{
    if(!RM){f.x+=f.vx;f.y+=f.vy;
      if(f.x<-20)f.x=VW+20;if(f.x>VW+20)f.x=-20;if(f.y<-20)f.y=VH+20;if(f.y>VH+20)f.y=-20;}
    const a=.22+.3*(.5+.5*Math.sin(t*.001*f.sp+f.ph));
    const sz=f.r*7;
    bgX.globalAlpha=a;
    bgX.drawImage(sprites[f.s],f.x+ox*f.dp-sz/2,f.y+oy*f.dp-sz/2,sz,sz);
  });
  bgX.globalAlpha=1;
}
function confetti(){
  if(RM)return;
  const n=Math.min(130,300-leaves.length);
  for(let i=0;i<n;i++)leaves.push({x:Math.random()*VW,y:-30-Math.random()*VH*.4,vx:(Math.random()-.5)*.8,vy:1.4+Math.random()*2.4,
    rot:Math.random()*6.28,vr:(Math.random()-.5)*.12,sz:5+Math.random()*7,c:CONF_COLORS[i%CONF_COLORS.length],ph:Math.random()*6.28});
}
function sparkBurst(x,y){
  if(RM||!x)return;
  for(let i=0;i<18;i++){const a=Math.random()*6.28,v=1.5+Math.random()*3.2;
    sparks.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,life:1,c:CONF_COLORS[i%CONF_COLORS.length],r:1.5+Math.random()*2});}
}
function drawFx(t){
  fxX.clearRect(0,0,VW,VH);
  for(let i=leaves.length-1;i>=0;i--){const l=leaves[i];
    l.vy=Math.min(l.vy+.02,3.4);l.x+=l.vx+Math.sin(t*.002+l.ph)*.5;l.y+=l.vy;l.rot+=l.vr;
    if(l.y>VH+40){leaves.splice(i,1);continue;}
    fxX.save();fxX.translate(l.x,l.y);fxX.rotate(l.rot);
    fxX.fillStyle=l.c;fxX.beginPath();fxX.ellipse(0,0,l.sz,l.sz*.55,0,0,6.29);fxX.fill();
    fxX.strokeStyle='rgba(6,15,11,.4)';fxX.lineWidth=1;fxX.beginPath();fxX.moveTo(-l.sz,0);fxX.lineTo(l.sz,0);fxX.stroke();
    fxX.restore();}
  if(sparks.length){fxX.globalCompositeOperation='lighter';
    for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];
      s.x+=s.vx;s.y+=s.vy;s.vy+=.08;s.life-=.03;
      if(s.life<=0){sparks.splice(i,1);continue;}
      fxX.globalAlpha=s.life;fxX.fillStyle=s.c;
      fxX.beginPath();fxX.arc(s.x,s.y,s.r*s.life,0,6.29);fxX.fill();}
    fxX.globalAlpha=1;fxX.globalCompositeOperation='source-over';}
}
function loop(t){requestAnimationFrame(loop);if(document.hidden)return;drawBg(t);drawFx(t);}

function fbShell(score,max,title,explain,corr){
  const cls=score===max?'ok':score>0?'mid':'bad';
  return `<div class="fb ${cls}" role="status">
    <div class="fb-h">${icon(score===max?'check':score>0?'warn':'x',19)}<b>${title}</b><span class="fb-pts">+${score} ${plural(score,'балл','балла','баллов')}</span></div>
    <p>${explain}</p>${corr?`<div class="fb-corr">${corr}</div>`:''}</div>`;
}
function checkBtnHTML(action,id,disabled,label='Проверить'){
  return `<button class="btn primary" data-action="${action}" data-id="${id}" ${disabled?'disabled':''}>${label} ${icon('check',16)}</button>`;
}
function scorePill(score,max){
  const cls=score===max?'ok':score>0?'mid':'bad';
  return `<span class="score-pill ${cls}">${score} / ${max} ${plural(max,'балл','балла','баллов')}</span>`;
}
function renderQuestion(q){
  const st=state.theory[q.id];
  if(q.type==='match')renderMatch(q,st);
  else if(q.type==='sort')renderSort(q,st);
  else renderMulti(q,st);
}
function renderMatch(q,st){
  const owner={};Object.entries(st.pairs).forEach(([l,r])=>owner[r]=l);
  const side=(items,isLeft)=>items.map((it,i)=>{
    let pairedId,chipIdx=-1,ok=false;
    if(isLeft){pairedId=st.pairs[it.id];chipIdx=i;ok=st.checked&&q.answer[it.id]===pairedId;}
    else{pairedId=owner[it.id];chipIdx=q.left.findIndex(l=>l.id===pairedId);ok=st.checked&&pairedId&&q.answer[pairedId]===it.id;}
    const c=chipIdx>=0?PAIR_COLORS[chipIdx]:'#1a3527';
    let cls='mitem';
    if(st.checked)cls+=ok?' good':' badf';
    else{if(pairedId)cls+=' paired';if(isLeft&&st.sel===it.id)cls+=' sel';}
    const chip=pairedId?`<span class="pchip" style="--pc:${c}">${chipIdx+1}</span>`:`<span class="pchip empty">·</span>`;
    const mark=st.checked?`<span class="mres">${icon(ok?'check':'x',15)}</span>`:'';
    return `<button class="${cls}" style="--pc:${c}" data-action="match-pick" data-q="${q.id}" data-side="${isLeft?'L':'R'}" data-id="${it.id}" ${st.checked?'disabled':''}>${chip}<span class="mt">${esc(it.t)}</span>${mark}</button>`;
  }).join('');
  const cnt=Object.keys(st.pairs).length;
  let foot;
  if(st.checked){
    const corr=q.left.map(l=>{
      const ok=st.pairs[l.id]===q.answer[l.id];
      const r=q.right.find(x=>x.id===q.answer[l.id]);
      return `<span class="cr ${ok?'cok':'cbad'}">${icon(ok?'check':'x',14)}<span><b>${esc(l.t)}</b> — ${esc(r.t)}</span></span>`;
    }).join('');
    foot=`<div class="qfoot"><span class="cnt">Проверено</span>${scorePill(st.score,2)}</div>`+
      fbShell(st.score,2,st.score===2?'Отлично! Всё верно':st.score===1?'Почти! Есть неточности':'Неверно — разберём',q.explain,corr);
  }else{
    foot=`<div class="qfoot"><span class="cnt">Связано ${cnt} / ${q.left.length}</span>${checkBtnHTML('check-th',q.id,cnt<q.left.length)}</div>`;
  }
  $('qb-'+q.id).innerHTML=`<div class="match-grid">
    <div class="mcol"><div class="mcol-h">Термин</div>${side(q.left,true)}</div>
    <div class="mcol"><div class="mcol-h">Описание</div>${side(q.right,false)}</div>
  </div>${foot}`;
}
function renderSort(q,st){
  const chipHTML=(it,inBin)=>{
    let cls='chip',mark='';
    if(st.checked){const ok=st.assign[it.id]===it.g;cls+=ok?' good':' badf';mark=`<span class="mres">${icon(ok?'check':'x',13)}</span>`;}
    else if(st.sel===it.id)cls+=' sel';
    const x=inBin&&!st.checked?`<span class="chip-x" data-action="sort-return" data-q="${q.id}" data-id="${it.id}" title="Вернуть">×</span>`:'';
    return `<button class="${cls}" data-action="sort-pick" data-q="${q.id}" data-id="${it.id}" ${st.checked?'disabled':''}>${esc(it.t)}${mark}${x}</button>`;
  };
  const pool=q.items.filter(it=>!st.assign[it.id]);
  const assigned=Object.keys(st.assign).length;
  const bins=q.groups.map(g=>{
    const items=q.items.filter(it=>st.assign[it.id]===g.id);
    return `<div class="bin ${g.id}${st.sel&&!st.checked?' await':''}" data-action="sort-bin" data-q="${q.id}" data-g="${g.id}">
      <div class="bin-h">${icon(g.ic,15)} ${g.t} <span class="mono" style="margin-left:auto;font-size:11px;color:var(--dim)">${items.length}</span></div>
      ${items.map(it=>chipHTML(it,true)).join('')}</div>`;
  }).join('');
  let foot;
  if(st.checked){
    const corr=q.groups.map(g=>{
      const items=q.items.filter(it=>it.g===g.id).map(it=>{
        const ok=st.assign[it.id]===it.g;
        return `<span class="cr ${ok?'cok':'cbad'}" style="display:inline-flex;margin-right:10px">${icon(ok?'check':'x',13)}<span>${esc(it.t)}</span></span>`;
      }).join('');
      return `<span class="cg">${g.t}:</span><span>${items}</span>`;
    }).join('');
    foot=`<div class="qfoot"><span class="cnt">Проверено</span>${scorePill(st.score,2)}</div>`+
      fbShell(st.score,2,st.score===2?'Отлично! Всё на месте':st.score===1?'Почти! Часть карточек не там':'Неверно — разберём',q.explain,corr);
  }else{
    foot=`<div class="qfoot"><span class="cnt">Распределено ${assigned} / ${q.items.length}</span>${checkBtnHTML('check-th',q.id,assigned<q.items.length)}</div>`;
  }
  $('qb-'+q.id).innerHTML=`
    <div class="pool-h">Нераспределённые — нажмите карточку, затем группу</div>
    <div class="pool${st.sel&&!st.checked?' await':''}" data-action="sort-bin" data-q="${q.id}" data-g="">${pool.map(it=>chipHTML(it,false)).join('')||'<span class="dim" style="font-size:12px;padding:6px">Все карточки распределены ✓</span>'}</div>
    <div class="bins">${bins}</div>${foot}`;
}
function renderMulti(q,st){
  const rows=q.options.map(o=>{
    const on=!!st.selSet[o.id];
    let cls='opt',tag='',box=on?icon('check',14):'';
    if(st.checked){
      if(o.ok&&on){cls+=' good';tag='верно ✓';box=icon('check',14);}
      else if(o.ok&&!on){cls+=' miss';tag='пропущено';box='';}
      else if(!o.ok&&on){cls+=' badf';tag='лишний ✗';box=icon('x',14);}
      else{cls+=' off';box='';}
    }else if(on)cls+=' on';
    return `<button class="${cls}" data-action="multi-tgl" data-q="${q.id}" data-id="${o.id}" ${st.checked?'disabled':''}>
      <span class="box">${box}</span><span class="ot">${esc(o.t)}</span>${tag?`<span class="otag">${tag}</span>`:''}</button>`;
  }).join('');
  const cnt=Object.keys(st.selSet).length;
  let foot;
  if(st.checked){
    const corr=q.options.filter(o=>o.ok).map(o=>`<span class="cr cok">${icon('check',14)}<span>${esc(o.t)}</span></span>`).join('');
    foot=`<div class="qfoot"><span class="cnt">Проверено</span>${scorePill(st.score,2)}</div>`+
      fbShell(st.score,2,st.score===2?'Отлично! Точный набор':st.score===1?'Почти! Не все верные отмечены':'Неверно — разберём',q.explain,corr);
  }else{
    foot=`<div class="qfoot"><span class="cnt">Отмечено ${cnt}</span>${checkBtnHTML('check-th',q.id,cnt===0)}</div>`;
  }
  $('qb-'+q.id).innerHTML=`<div class="opts">${rows}</div>${foot}`;
}
function correctText(p){
  return p.type==='num'?String(p.answer):p.options.find(o=>o.id===p.correct).t;
}
function renderPractice(p){
  const st=state.practice[p.id];
  let answerHTML='';
  if(p.type==='num'){
    answerHTML=`<div class="ansrow">
      <input class="ans" data-pr="${p.id}" inputmode="numeric" maxlength="6" placeholder="Ответ: число" value="${esc(st.answer)}" ${st.checked?'disabled':''} aria-label="Ответ на задачу">
      ${st.checked?'':checkBtnHTML('check-pr',p.id,!st.answer)}
      ${st.checked?'':`<button class="btn ghost sm" data-action="hint" data-id="${p.id}">${icon('bulb',15)} Подсказка</button>`}
    </div>`;
  }else{
    const opts=p.options.map(o=>{
      const on=st.sel===o.id;
      let cls='opt choice',box=on?icon('check',13):'',tag='';
      if(st.checked){
        if(o.id===p.correct){cls+=' good';box=icon('check',13);tag='верный ответ';}
        else if(on){cls+=' badf';box=icon('x',13);tag='ваш выбор';}
        else cls+=' off';
      }else if(on)cls+=' on';
      return `<button class="${cls}" data-action="pr-choice" data-id="${p.id}" data-opt="${o.id}" ${st.checked?'disabled':''}><span class="box">${box}</span><span class="ot">${esc(o.t)}</span>${tag?`<span class="otag">${tag}</span>`:''}</button>`;
    }).join('');
    answerHTML=`<div class="choicegrid">${opts}</div>
      <div class="ansrow">${st.checked?'':checkBtnHTML('check-pr',p.id,!st.sel)}
      ${st.checked?'':`<button class="btn ghost sm" data-action="hint" data-id="${p.id}">${icon('bulb',15)} Подсказка</button>`}</div>`;
  }
  const hint=st.hint&&!st.checked?`<div class="hintcard">${icon('bulb',16)}<span>${p.hint}</span></div>`:'';
  let fb='';
  if(st.checked){
    fb=fbShell(st.score,p.pts,
      st.score>0?`Верно! +${st.score} ${plural(st.score,'балл','балла','баллов')}`:'Неверно — смотрим решение',
      p.solution,
      st.score>0?'':`<span class="cr cok">${icon('check',14)}<span>Правильный ответ: <b class="mono">${esc(correctText(p))}</b></span></span>`);
    if(st.score>0)fb=`<div class="ansrow" style="margin-top:14px">${scorePill(st.score,p.pts)}</div>`+fb;
  }
  $('pb-'+p.id).innerHTML=answerHTML+hint+fb;
}
function updateDots(){
  const html=PRACTICE.map((p,i)=>{
    const st=state.practice[p.id];
    const cls=st.checked?(st.score===p.pts?'full':st.score>0?'part':'zero'):'none';
    const cur=SLIDES[curSlide].key===p.id?' cur':'';
    return `<button class="pdot ${cls}${cur}" data-action="goto" data-slide="${PRACTICE_START+i}" title="Задача ${i+1} · ${p.pts} ${plural(p.pts,'балл','балла','баллов')}">${i+1}</button>`;
  }).join('');
  document.querySelectorAll('.pdots').forEach(el=>el.innerHTML=html);
}

function lightRoute(i){
  const scope=$('w1-body');if(!scope)return;
  scope.classList.toggle('hovering',i!=null);
  let es=null,ns=null;
  if(i!=null){const r=ROUTES1[i];ns=new Set(r.seq);es=new Set();
    for(let k=0;k<r.seq.length-1;k++)es.add([r.seq[k],r.seq[k+1]].sort().join(''));}
  scope.querySelectorAll('[data-paths]').forEach(el=>el.classList.toggle('lit',i!=null&&el.dataset.paths.split(',').includes(String(i))));
  scope.querySelectorAll('[data-edge]').forEach(el=>el.classList.toggle('lit',i!=null&&es.has(el.dataset.edge)));
  scope.querySelectorAll('[data-node]').forEach(el=>el.classList.toggle('lit',i!=null&&ns.has(el.dataset.node)));
}

    requestAnimationFrame(tick);

function btnCenter(sel){const b=document.querySelector(sel);if(!b)return null;const r=b.getBoundingClientRect();return {x:r.left+r.width/2,y:r.top+r.height/2};}
function attnNext(){$('btn-next').classList.add('attn');}
function updateScore(){
  const el=$('score-val');el.textContent=totalScore();
  const chip=$('scorechip');chip.classList.remove('pop');void chip.offsetWidth;chip.classList.add('pop');
}
function checkTheory(id,ev){
  const q=THEORY.find(x=>x.id===id),st=state.theory[id];
  if(st.checked)return;
  let score=0;
  if(q.type==='match'){
    const ok=q.left.filter(l=>st.pairs[l.id]===q.answer[l.id]).length;
    score=ok===4?2:ok>=2?1:0;
  }else if(q.type==='sort'){
    const ok=q.items.filter(it=>st.assign[it.id]===it.g).length;
    score=ok===6?2:ok>=3?1:0;
  }else{
    const C=q.options.filter(o=>o.ok).map(o=>o.id);
    const S=Object.keys(st.selSet);
    const exact=S.length===C.length&&C.every(c=>st.selSet[c]);
    const noWrong=S.every(s=>C.includes(s));
    score=exact?2:(noWrong&&S.length>0)?1:0;
  }
  st.checked=true;st.score=score;st.sel=null;save();
  renderQuestion(q);updateScore();attnNext();
  sfx(score===2?'correct':score===1?'partial':'wrong');
  if(score===2){const pt=(ev&&ev.clientX>0)?{x:ev.clientX,y:ev.clientY}:btnCenter(`[data-action="check-th"][data-id="${id}"]`);if(pt)sparkBurst(pt.x,pt.y);}
}
function checkPractice(id,ev){
  const p=PRACTICE.find(x=>x.id===id),st=state.practice[id];
  if(st.checked)return;
  if(p.type==='num'){
    if(!st.answer){toast('Введите число-ответ','warn');sfx('tap');return;}
    st.correct=parseInt(st.answer,10)===p.answer;
  }else{
    if(!st.sel){toast('Выберите вариант ответа','warn');sfx('tap');return;}
    st.correct=st.sel===p.correct;
  }
  st.checked=true;st.score=st.correct?p.pts:0;save();
  renderPractice(p);updateScore();updateDots();attnNext();
  sfx(st.correct?'correct':'wrong');
  if(st.correct){const pt=(ev&&ev.clientX>0)?{x:ev.clientX,y:ev.clientY}:btnCenter(`[data-action="check-pr"][data-id="${id}"]`)||{x:VW/2,y:VH/2};sparkBurst(pt.x,pt.y);}
}

document.addEventListener('pointerdown',()=>{userGestured=true;},{passive:true});
document.addEventListener('click',e=>{
  const btn=e.target.closest('[data-action]');
  if(!btn)return;
  const ds=btn.dataset,a=ds.action;
  switch(a){
    case 'start':tryStart();break;
    case 'nav-next':next();break;
    case 'nav-prev':prev();break;
    case 'goto':goto(parseInt(ds.slide,10));break;
    case 'sound':state.sound=!state.sound;save();updateSound();if(state.sound)sfx('select');break;
    case 'match-pick':{
      const q=THEORY.find(x=>x.id===ds.q),st=state.theory[ds.q];
      if(st.checked)break;
      if(ds.side==='L'){
        if(st.pairs[ds.id]){delete st.pairs[ds.id];st.sel=ds.id;sfx('unpair');}
        else{st.sel=st.sel===ds.id?null:ds.id;sfx('select');}
      }else{
        const owner=Object.keys(st.pairs).find(l=>st.pairs[l]===ds.id);
        if(owner){delete st.pairs[owner];
          if(st.sel){st.pairs[st.sel]=ds.id;st.sel=null;sfx('pair');}else sfx('unpair');}
        else if(st.sel){st.pairs[st.sel]=ds.id;st.sel=null;sfx('pair');}
        else{toast('Сначала выберите термин слева','info',2200);sfx('tap');}
      }
      save();renderQuestion(q);break;}
    case 'sort-pick':{
      const q=THEORY.find(x=>x.id===ds.q),st=state.theory[ds.q];
      if(st.checked)break;
      st.sel=st.sel===ds.id?null:ds.id;sfx('select');save();renderQuestion(q);break;}
    case 'sort-bin':{
      const q=THEORY.find(x=>x.id===ds.q),st=state.theory[ds.q];
      if(st.checked||!st.sel)break;
      if(ds.g)st.assign[st.sel]=ds.g;else delete st.assign[st.sel];
      st.sel=null;sfx(ds.g?'pair':'unpair');save();renderQuestion(q);break;}
    case 'sort-return':{
      const q=THEORY.find(x=>x.id===ds.q),st=state.theory[ds.q];
      if(st.checked)break;
      delete st.assign[ds.id];if(st.sel===ds.id)st.sel=null;
      sfx('unpair');save();renderQuestion(q);break;}
    case 'multi-tgl':{
      const q=THEORY.find(x=>x.id===ds.q),st=state.theory[ds.q];
      if(st.checked)break;
      if(st.selSet[ds.id])delete st.selSet[ds.id];else st.selSet[ds.id]=true;
      sfx('select');save();renderQuestion(q);break;}
    case 'check-th':checkTheory(ds.id,e);break;
    case 'pr-choice':{
      const p=PRACTICE.find(x=>x.id===ds.id),st=state.practice[ds.id];
      if(st.checked)break;
      st.sel=ds.opt;sfx('select');save();renderPractice(p);break;}
    case 'check-pr':checkPractice(ds.id,e);break;
    case 'hint':{
      const p=PRACTICE.find(x=>x.id===ds.id),st=state.practice[ds.id];
      st.hint=!st.hint;sfx('tap');save();renderPractice(p);break;}
    case 'wstep':{
      const w=ds.w;state.walk['w'+w]=parseInt(ds.s,10);sfx('step');save();renderWalk(w);break;}
    case 'wnext':{
      const w=parseInt(ds.w,10),s=state.walk['w'+w];
      if(s<3){state.walk['w'+w]=s+1;sfx('step');save();renderWalk(w);}
      else goto(w===1?slideIndex('walk2'):slideIndex('p1'));
      break;}
    case 'w2bonus':state.walk.bonus=!state.walk.bonus;sfx('select');save();renderWalk(2);break;
    case 'anat':pinnedPart=pinnedPart===ds.part?null:ds.part;sfx('tap');applyAnat();break;
    case 'matrix-cell':pinnedMatrixKey=pinnedMatrixKey===ds.key?null:ds.key;sfx('select');applyMatrix();break;
    case 'refl-level':{
      state.reflection.level=parseInt(ds.lvl,10);
      $('refl-ladder').classList.remove('err');
      sfx('select');save();renderReflection();break;}
    case 'stamp':stampTicket();break;
    case 'download':download();break;
    case 'mail':sendMail();break;
    case 'send-both':download();setTimeout(sendMail,700);break;
    case 'restart':openModal({title:'Пройти заново?',text:'Все ответы, баллы и билет будут сброшены. Имя и класс сохранятся. Отменить это действие нельзя.',ok:'Сбросить и начать',onOk:()=>resetLesson(true)});break;
    case 'new-student':openModal({title:'Новый ученик?',text:'Текущие ответы и имя будут удалены — урок начнётся с чистого листа для следующего ученика.',ok:'Начать заново',onOk:()=>resetLesson(false)});break;
    case 'modal-ok':{const cb=modalCb;closeModal();if(cb)cb();break;}
    case 'modal-cancel':closeModal();break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='f-name'){state.name=t.value;save();return;}
  if(t.id==='f-klass'){state.klass=t.value;save();return;}
  if(t.dataset.pr!==undefined){
    const st=state.practice[t.dataset.pr];if(st.checked)return;
    const clean=t.value.replace(/[^\d]/g,'').slice(0,6);
    if(t.value!==clean)t.value=clean;
    st.answer=clean;save();
    const btn=document.querySelector(`[data-action="check-pr"][data-id="${t.dataset.pr}"]`);
    if(btn)btn.disabled=!clean;
    return;}
  if(t.dataset.refl){
    state.reflection[t.dataset.refl]=t.value.slice(0,400);
    t.classList.remove('err');save();return;}
});
document.addEventListener('keydown',e=>{
  if(modalOpen){
    if(e.key==='Escape')closeModal();
    if(e.key==='Tab'){e.preventDefault();(document.activeElement===$('m-ok')?$('m-cancel'):$('m-ok')).focus();}
    return;}
  const tag=e.target.tagName;
  if(tag==='INPUT'&&e.key==='Enter'){
    if(e.target.dataset.pr){e.preventDefault();checkPractice(e.target.dataset.pr,e);}
    else if(e.target.id==='f-name'||e.target.id==='f-klass'){e.preventDefault();tryStart();}
    return;}
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT')return;
  if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();next();}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev();}
});
document.addEventListener('mouseover',e=>{
  const r=e.target.closest('[data-route]');
  if(r){lightRoute(parseInt(r.dataset.route,10));return;}
  const mc=e.target.closest('[data-key]');
  if(mc){hoverMatrixKey=mc.dataset.key;applyMatrix();return;}
  const a=e.target.closest('[data-anat-chip]');
  if(a){hoverPart=a.dataset.part;applyAnat();}
});
document.addEventListener('mouseout',e=>{
  const r=e.target.closest('[data-route]');
  if(r&&!(e.relatedTarget&&r.contains(e.relatedTarget)))lightRoute(null);
  const mc=e.target.closest('[data-key]');
  if(mc&&!(e.relatedTarget&&mc.contains(e.relatedTarget))){hoverMatrixKey=null;applyMatrix();}
  const a=e.target.closest('[data-anat-chip]');
  if(a&&!(e.relatedTarget&&a.contains(e.relatedTarget))){hoverPart=null;applyAnat();}
});
document.addEventListener('pointermove',e=>{mouseNX=e.clientX/Math.max(1,VW);mouseNY=e.clientY/Math.max(1,VH);},{passive:true});
let resizeT=null;
window.addEventListener('resize',()=>{
  clearTimeout(resizeT);
  resizeT=setTimeout(()=>{sizeCanvases();seedFlies();if(RM)drawBg(0);},120);
});

/* ================================================================
   СТАРТ
================================================================ */
function renderAllWidgets(){
  THEORY.forEach(renderQuestion);
  PRACTICE.forEach(renderPractice);
  renderWalk(1);renderWalk(2);
  renderReflection();renderResults(false);renderFinal();
  $('f-name').value=state.name;
  $('f-klass').value=state.klass||'9';
  updateDots();
}
(function boot(){
  buildDeck();
  renderAllWidgets();
  updateSound();
  $('score-val').textContent=totalScore();
  if(state.slide>0&&state.name.trim().length<2)state.slide=0;
  const hadProgress=state.slide>0||THEORY.some(q=>state.theory[q.id].checked)||PRACTICE.some(p=>state.practice[p.id].checked);
  goto(state.slide,true);
  sizeCanvases();seedFlies();
  if(RM){drawBg(0);}else{requestAnimationFrame(loop);}
  t2tick();
  if(!RM)setInterval(t2tick,2400);
  if(hadProgress)setTimeout(()=>toast('Прогресс восстановлен — продолжаем урок','info'),600);
})();
</script>
